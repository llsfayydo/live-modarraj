<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>مدرج لايف</title>

  <style>

    :root {
      --bg: #07111f;
      --card: #111f35;
      --card-2: #172b4b;
      --line: #293e5d;
      --gold: #f5a000;
      --text: #f7f9fc;
      --muted: #9aacc5;
      --green: #19d38a;
      --red: #ff6978;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          180deg,
          #0a1a34 0%,
          #06101c 100%
        );
      color: var(--text);
      font-family:
        Tahoma,
        Arial,
        sans-serif;
      min-height: 100vh;
    }

    /* =========================
       Header
    ========================= */

    header {
      text-align: center;
      padding: 30px 15px 25px;

      background:
        linear-gradient(
          180deg,
          #10254a,
          #081426
        );

      border-bottom:
        2px solid var(--gold);
    }

    header h1 {
      margin: 0;

      font-size: 34px;
      font-weight: 900;
    }

    header p {
      margin: 8px 0 0;

      color: var(--muted);

      font-size: 14px;
    }

    /* =========================
       Main
    ========================= */

    main {
      width: min(1050px, 94%);

      margin:
        22px auto
        50px;
    }

    /* =========================
       Date Buttons
    ========================= */

    .days {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom: 20px;
    }

    .day {
      padding: 13px;

      border:
        1px solid
        var(--line);

      border-radius: 14px;

      background:
        var(--card);

      color: #b8c6d8;

      font-weight: 800;

      cursor: pointer;

      transition:
        .2s ease;
    }

    .day:hover {
      border-color:
        var(--gold);
    }

    .day.active {
      background:
        var(--gold);

      color: #111;

      border-color:
        var(--gold);
    }

    /* =========================
       Summary
    ========================= */

    .summary {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      color:
        var(--muted);

      font-size: 13px;

      margin-bottom: 14px;
    }

    #count {
      color: #fff;

      font-weight: 900;
    }

    #dateLabel {
      text-align: left;
    }

    /* =========================
       League
    ========================= */

    .league {
      overflow: hidden;

      margin-bottom: 22px;

      border:
        1px solid
        var(--line);

      border-radius: 16px;

      background:
        rgba(17, 31, 53, .88);
    }

    .league-head {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      padding:
        13px 16px;

      background:
        var(--card-2);

      border-right:
        4px solid
        var(--gold);
    }

    .league-head strong {
      font-size: 16px;

      font-weight: 900;
    }

    .league-head small {
      color:
        var(--muted);
    }

    /* =========================
       Match
    ========================= */

    .match {
      padding:
        18px 15px;

      border-top:
        1px solid
        var(--line);
    }

    .match-top {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 15px;

      color:
        var(--muted);

      font-size: 12px;
    }

    .badge {
      padding:
        4px 8px;

      border-radius: 12px;

      color: #ffd55e;

      border:
        1px solid
        #765a18;
    }

    /* =========================
       Teams
    ========================= */

    .teams {
      display: grid;

      grid-template-columns:
        1fr 110px 1fr;

      align-items: center;

      gap: 10px;
    }

    .team {
      text-align: center;
    }

    .logo {
      width: 58px;
      height: 58px;

      object-fit: contain;

      margin:
        0 auto 8px;

      display: block;
    }

    .team-name {
      font-weight: 900;

      font-size: 16px;

      line-height: 1.5;
    }

    /* =========================
       Score
    ========================= */

    .center {
      text-align: center;
    }

    .score {
      font-size: 28px;

      font-weight: 900;
    }

    .status {
      display: inline-block;

      margin-top: 6px;

      padding:
        4px 9px;

      border-radius: 12px;

      background:
        #30415a;

      color:
        #d1dbe8;

      font-size: 11px;

      font-weight: 800;
    }

    .status.live {
      background:
        #086d4d;

      color:
        #74ffc4;
    }

    .status.finished {
      background:
        #3d485b;
    }

    /* =========================
       Details
    ========================= */

    .details {
      display: flex;

      justify-content: center;

      gap: 13px;

      flex-wrap: wrap;

      margin-top: 15px;

      padding-top: 11px;

      border-top:
        1px solid
        var(--line);

      font-size: 12px;

      color:
        var(--muted);
    }

    /*
      القناة لا تظهر إذا كانت
      غير متوفرة
    */

    .channel {
      color:
        #ffd45e;

      font-weight: 900;
    }

    /* =========================
       Loading
    ========================= */

    .loading,
    .empty,
    .error {
      text-align: center;

      padding: 45px 20px;

      border:
        1px dashed
        var(--line);

      border-radius: 17px;

      background:
        var(--card);

      color:
        var(--muted);
    }

    .error {
      color:
        #ff9ca5;
    }

    .retry {
      margin-top: 12px;

      padding:
        9px 17px;

      border: 0;

      border-radius: 9px;

      background:
        var(--gold);

      font-weight: 900;

      cursor: pointer;
    }

    /* =========================
       Footer
    ========================= */

    footer {
      text-align: center;

      color:
        #657b99;

      border-top:
        1px solid
        var(--line);

      width:
        min(1050px, 94%);

      margin:
        auto;

      padding:
        20px;

      font-size: 12px;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 700px) {

      header h1 {
        font-size: 28px;
      }

      .teams {
        grid-template-columns:
          1fr 75px 1fr;
      }

      .logo {
        width: 46px;
        height: 46px;
      }

      .team-name {
        font-size: 14px;
      }

      .score {
        font-size: 23px;
      }

      .summary {
        align-items: flex-start;

        gap: 10px;

        flex-direction:
          column;
      }

      #dateLabel {
        text-align: right;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       Header
       لا توجد هنا عبارة
       "السيرفر يعمل"
  ========================= -->

  <header>

    <h1>
      ⚽ مدرج لايف
    </h1>

    <p>
      أهم المباريات أولاً
    </p>

  </header>


  <main>

    <!-- =========================
         Dates
    ========================= -->

    <div class="days">

      <button
        class="day"
        data-offset="-1"
      >
        أمس
      </button>

      <button
        class="day active"
        data-offset="0"
      >
        اليوم
      </button>

      <button
        class="day"
        data-offset="1"
      >
        غداً
      </button>

    </div>


    <!-- =========================
         Summary
    ========================= -->

    <div class="summary">

      <span>
        المباريات:
        <b id="count">0</b>
      </span>

      <span id="dateLabel"></span>

    </div>


    <!-- =========================
         Matches
    ========================= -->

    <section id="matches">

      <div class="loading">
        ⏳ جاري تحميل المباريات...
      </div>

    </section>

  </main>


  <footer>
    مدرج لايف © 2026
  </footer>


  <script>

    /* =========================
       API
    ========================= */

    const API = "/api/matches";


    /* =========================
       Current Date
    ========================= */

    let currentDate =
      formatDate(
        new Date()
      );


    /* =========================
       League Priority
    ========================= */

    const leaguePriority = [

      "FIFA World Cup",
      "World Cup",

      "AFC Asian Cup",
      "Asian Cup",

      "UEFA Champions League",
      "UEFA Europa League",
      "UEFA Europa Conference League",

      "English Premier League",
      "Premier League",

      "La Liga",
      "Serie A",
      "Bundesliga",
      "Ligue 1",

      "Saudi Professional League",
      "Saudi-Arabian Pro League",
      "Saudi Pro League",

      "AFC Champions League Elite",
      "AFC Champions League",

      "CAF Champions League",

      "Moroccan Botola",
      "Botola Pro",

      "Egyptian Premier League",

      "Qatar Stars League",

      "UAE Pro League",

      "Iraq Stars League",

      "Kuwait Premier League",

      "Tunisian Ligue 1",

      "Algeria Ligue 1"

    ];


    /* =========================
       Date Helpers
    ========================= */

    function formatDate(date) {

      return `${date.getFullYear()}-${String(
        date.getMonth() + 1
      ).padStart(2, "0")}-${String(
        date.getDate()
      ).padStart(2, "0")}`;

    }


    function dateOffset(offset) {

      const date =
        new Date();

      date.setDate(
        date.getDate() +
        offset
      );

      return formatDate(date);

    }


    /* =========================
       Escape HTML
    ========================= */

    function esc(value) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================
       League Name
    ========================= */

    function leagueName(match) {

      return (
        match?.league?.name ||
        match?.league?.originalName ||
        "بطولة أخرى"
      );

    }


    /* =========================
       Priority
    ========================= */

    function priority(match) {

      const name =
        leagueName(match)
          .toLowerCase();

      const index =
        leaguePriority.findIndex(
          league =>
            name.includes(
              league.toLowerCase()
            )
        );

      let score =
        index >= 0
          ? 1000 - index
          : 100;


      /*
        المباريات المباشرة
        لها أعلى أولوية
      */

      if (
        ["LIVE", "HT"]
          .includes(
            match?.fixture?.status?.short
          )
      ) {

        score += 5000;

      }


      score +=
        Number(
          match?.priority || 0
        );


      return score;

    }


    /* =========================
       Match Status
    ========================= */

    function status(match) {

      const value =
        String(
          match?.fixture?.status?.short ||
          ""
        ).toUpperCase();


      if (
        [
          "LIVE",
          "1H",
          "2H",
          "ET",
          "P"
        ].includes(value)
      ) {

        return [
          "مباشر",
          "live"
        ];

      }


      if (value === "HT") {

        return [
          "استراحة",
          "live"
        ];

      }


      if (
        [
          "FT",
          "AET",
          "PEN"
        ].includes(value)
      ) {

        return [
          "انتهت",
          "finished"
        ];

      }


      return [
        "لم تبدأ",
        ""
      ];

    }


    /* =========================
       Time
    ========================= */

    function time(match) {

      const raw =
        match?.fixture?.date;


      if (!raw) {
        return "";
      }


      const date =
        new Date(raw);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleTimeString(
        "ar-SA",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =========================
       Channel
       لا نعرضها إذا لم توجد
    ========================= */

    function channel(match) {

      const value =
        match?.media?.channel;


      if (
        typeof value !== "string"
      ) {

        return "";

      }


      const channel =
        value.trim();


      if (
        !channel ||
        channel === "-"
      ) {

        return "";

      }


      return channel;

    }


    /* =========================
       Match Card
    ========================= */

    function card(match) {

      const home =
        match?.teams?.home || {};

      const away =
        match?.teams?.away || {};


      const matchStatus =
        status(match);


      const matchChannel =
        channel(match);


      const homeGoals =
        match?.goals?.home;


      const awayGoals =
        match?.goals?.away;


      const score =
        homeGoals === null ||
        homeGoals === undefined ||
        awayGoals === null ||
        awayGoals === undefined
          ? "VS"
          : `${homeGoals} - ${awayGoals}`;


      const important =
        Number(
          match?.priority || 0
        ) >= 70;


      return `

        <article class="match">

          <div class="match-top">

            <span>
              ${esc(
                time(match)
              )}
            </span>


            ${
              important
                ? `
                  <span class="badge">
                    ⭐ مباراة مهمة
                  </span>
                `
                : ""
            }

          </div>


          <div class="teams">


            <!-- Home -->

            <div class="team">

              ${
                home.logo
                  ? `
                    <img
                      class="logo"
                      src="${esc(home.logo)}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }

              <div class="team-name">

                ${esc(
                  home.name ||
                  "فريق غير معروف"
                )}

              </div>

            </div>


            <!-- Score -->

            <div class="center">

              <div class="score">

                ${esc(score)}

              </div>


              <span
                class="status ${matchStatus[1]}"
              >

                ${matchStatus[0]}

              </span>

            </div>


            <!-- Away -->

            <div class="team">

              ${
                away.logo
                  ? `
                    <img
                      class="logo"
                      src="${esc(away.logo)}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }

              <div class="team-name">

                ${esc(
                  away.name ||
                  "فريق غير معروف"
                )}

              </div>

            </div>


          </div>


          <!--
            المعلومات الإضافية
          -->

          <div class="details">


            ${
              match?.venue
                ? `
                  <span>
                    🏟️
                    ${esc(match.venue)}
                  </span>
                `
                : ""
            }


            ${
              match?.city
                ? `
                  <span>
                    📍
                    ${esc(match.city)}
                  </span>
                `
                : ""
            }


            ${
              matchChannel
                ? `
                  <span class="channel">
                    📺
                    ${esc(matchChannel)}
                  </span>
                `
                : ""
            }


          </div>

        </article>

      `;

    }


    /* =========================
       Render Matches
    ========================= */

    function render(data) {

      const root =
        document.getElementById(
          "matches"
        );


      document.getElementById(
        "count"
      ).textContent =
        data.length;


      if (!data.length) {

        root.innerHTML = `

          <div class="empty">

            <div
              style="
                font-size:36px;
                margin-bottom:10px;
              "
            >
              ⚽
            </div>

            <p>
              لا توجد مباريات مجدولة
              في هذا التاريخ.
            </p>

          </div>

        `;

        return;

      }


      /*
        ترتيب المباريات
        حسب الأولوية
      */

      const sorted =
        [...data].sort(
          (a, b) =>
            priority(b) -
            priority(a)
        );


      /*
        تجميع حسب البطولة
      */

      const groups =
        new Map();


      sorted.forEach(
        match => {

          const name =
            leagueName(match);


          if (
            !groups.has(name)
          ) {

            groups.set(
              name,
              []
            );

          }


          groups
            .get(name)
            .push(match);

        }
      );


      /*
        بناء الواجهة
      */

      root.innerHTML =
        [...groups]
          .map(
            ([name, matches]) => `

              <section class="league">

                <div
                  class="league-head"
                >

                  <strong>
                    🏆
                    ${esc(name)}
                  </strong>

                  <small>
                    ${matches.length}
                    مباراة
                  </small>

                </div>


                ${matches
                  .map(card)
                  .join("")}

              </section>

            `
          )
          .join("");

    }


    /* =========================
       Load Matches
    ========================= */

    async function load() {

      const root =
        document.getElementById(
          "matches"
        );


      root.innerHTML = `

        <div class="loading">

          ⏳ جاري تحميل المباريات...

        </div>

      `;


      try {

        const response =
          await fetch(
            `${API}?date=${encodeURIComponent(
              currentDate
            )}`,
            {
              cache: "no-store",

              headers: {
                Accept:
                  "application/json"
              }
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        console.log(
          "مدرج لايف:",
          json
        );


        const data =
          Array.isArray(
            json.data
          )
            ? json.data
            : [];


        render(data);


      } catch (error) {

        console.error(
          error
        );


        document.getElementById(
          "count"
        ).textContent =
          "0";


        root.innerHTML = `

          <div class="error">

            ⚠️ تعذر تحميل المباريات.

            <br>

            <small>
              ${esc(
                error.message
              )}
            </small>

            <br>

            <button
              class="retry"
              onclick="load()"
            >
              إعادة المحاولة
            </button>

          </div>

        `;

      }

    }


    /* =========================
       Date Label
    ========================= */

    function updateDate() {

      const active =
        document.querySelector(
          ".day.active"
        );


      const offset =
        active?.dataset.offset ||
        "0";


      let label;


      if (
        offset === "0"
      ) {

        label = "اليوم";

      } else if (
        offset === "1"
      ) {

        label = "غداً";

      } else {

        label = "أمس";

      }


      document.getElementById(
        "dateLabel"
      ).textContent =
        `${label} — ${currentDate}`;

    }


    /* =========================
       Date Buttons
    ========================= */

    document
      .querySelectorAll(".day")
      .forEach(
        button => {

          button.onclick =
            () => {

              document
                .querySelectorAll(
                  ".day"
                )
                .forEach(
                  item =>
                    item.classList
                      .remove(
                        "active"
                      )
                );


              button.classList
                .add(
                  "active"
                );


              currentDate =
                dateOffset(
                  Number(
                    button.dataset
                      .offset
                  )
                );


              updateDate();

              load();

            };

        }
      );


    /* =========================
       Start
    ========================= */

    updateDate();

    load();


    /*
      تحديث المباريات
      كل دقيقة
    */

    setInterval(
      load,
      60 * 1000
    );

  </script>

</body>
</html>
