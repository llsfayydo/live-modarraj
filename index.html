<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Modarraj Live - Live football scores, fixtures and match information."
  >

  <title>Modarraj Live</title>

  <style>

    :root {
      --bg: #07111f;
      --bg2: #0b1930;
      --card: #101f36;
      --card2: #162944;
      --border: #263d5d;

      --gold: #f5a000;
      --gold2: #ffbd32;

      --text: #f7f9fc;
      --muted: #8fa4bf;

      --green: #16d68a;
      --green-bg: #073f31;

      --red: #ff6978;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #122a4e 0%,
          var(--bg) 45%,
          #050c15 100%
        );

      color: var(--text);

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        rgba(7, 17, 31, .94);

      backdrop-filter:
        blur(14px);

      border-bottom:
        1px solid
        rgba(245, 160, 0, .35);
    }

    .header-inner {

      width:
        min(1150px, 94%);

      margin:
        auto;

      min-height:
        76px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap: 20px;
    }

    .brand {

      display:
        flex;

      align-items:
        center;

      gap: 12px;

      text-decoration:
        none;

      color:
        white;
    }

    .brand-icon {

      width: 42px;

      height: 42px;

      border-radius: 12px;

      display:
        grid;

      place-items:
        center;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold2)
        );

      color:
        #101010;

      font-size: 22px;

      box-shadow:
        0 5px 20px
        rgba(245, 160, 0, .18);
    }

    .brand-title {

      font-size: 21px;

      font-weight: 900;

      letter-spacing:
        -.3px;
    }

    .brand-subtitle {

      color:
        var(--muted);

      font-size: 11px;

      margin-top: 2px;
    }

    .language-switch {

      display:
        flex;

      gap: 3px;

      padding: 4px;

      border:
        1px solid
        var(--border);

      border-radius: 10px;

      background:
        var(--card);
    }

    .lang {

      border: 0;

      background:
        transparent;

      color:
        var(--muted);

      padding:
        7px 12px;

      border-radius: 7px;

      font-weight: 800;

      cursor: pointer;
    }

    .lang.active {

      background:
        var(--gold);

      color:
        #111;
    }

    /* =========================
       MAIN
    ========================= */

    main {

      width:
        min(1150px, 94%);

      margin:
        28px auto 60px;
    }

    .hero {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap: 20px;

      margin-bottom:
        22px;
    }

    .hero h1 {

      margin: 0;

      font-size:
        clamp(26px, 4vw, 38px);

      font-weight:
        950;

      letter-spacing:
        -.7px;
    }

    .hero p {

      margin:
        7px 0 0;

      color:
        var(--muted);

      font-size:
        14px;
    }

    .refresh {

      border:
        1px solid
        var(--border);

      background:
        var(--card);

      color:
        white;

      padding:
        10px 15px;

      border-radius:
        10px;

      cursor:
        pointer;

      font-weight:
        800;
    }

    .refresh:hover {

      border-color:
        var(--gold);

    }

    /* =========================
       DATE NAV
    ========================= */

    .date-nav {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom:
        24px;
    }

    .date-button {

      border:
        1px solid
        var(--border);

      background:
        var(--card);

      color:
        var(--muted);

      border-radius:
        13px;

      padding:
        13px 10px;

      cursor:
        pointer;

      font-weight:
        800;

      transition:
        .18s ease;
    }

    .date-button:hover {

      border-color:
        var(--gold);

      color:
        white;
    }

    .date-button.active {

      background:
        var(--gold);

      color:
        #111;

      border-color:
        var(--gold);
    }

    .date-main {

      display:
        block;

      font-size:
        15px;
    }

    .date-small {

      display:
        block;

      margin-top:
        3px;

      font-size:
        11px;

      opacity:
        .8;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        13px;

      color:
        var(--muted);

      font-size:
        13px;
    }

    .summary strong {

      color:
        white;
    }

    /* =========================
       LIVE BAR
    ========================= */

    .live-bar {

      display:
        none;

      margin-bottom:
        18px;

      padding:
        13px 16px;

      border:
        1px solid
        rgba(22, 214, 138, .3);

      background:
        linear-gradient(
          90deg,
          rgba(7, 63, 49, .9),
          rgba(7, 63, 49, .45)
        );

      border-radius:
        13px;

      color:
        #8fffcf;

      font-weight:
        900;
    }

    .live-bar.show {
      display: block;
    }

    .live-dot {

      display:
        inline-block;

      width: 8px;

      height: 8px;

      margin-inline-end:
        8px;

      border-radius:
        50%;

      background:
        var(--green);

      box-shadow:
        0 0 10px
        var(--green);
    }

    /* =========================
       LEAGUE
    ========================= */

    .league {

      overflow:
        hidden;

      margin-bottom:
        20px;

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      background:
        rgba(16, 31, 54, .86);

      box-shadow:
        0 8px 35px
        rgba(0,0,0,.12);
    }

    .league-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap: 15px;

      padding:
        14px 17px;

      background:
        var(--card2);

      border-inline-start:
        4px solid
        var(--gold);
    }

    .league-name {

      display:
        flex;

      align-items:
        center;

      gap: 9px;

      font-size:
        16px;

      font-weight:
        900;
    }

    .league-count {

      color:
        var(--muted);

      font-size:
        12px;
    }

    /* =========================
       MATCH
    ========================= */

    .match {

      border-top:
        1px solid
        var(--border);

      padding:
        17px 15px;
    }

    .match-meta {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      color:
        var(--muted);

      font-size:
        11px;

      margin-bottom:
        15px;
    }

    .important {

      color:
        #ffd36a;

      font-weight:
        900;
    }

    .match-grid {

      display:
        grid;

      grid-template-columns:
        1fr 130px 1fr;

      align-items:
        center;

      gap: 10px;
    }

    .team {

      min-width:
        0;

      text-align:
        center;
    }

    .team-logo {

      display:
        block;

      width:
        58px;

      height:
        58px;

      margin:
        0 auto 8px;

      object-fit:
        contain;
    }

    .team-name {

      font-size:
        15px;

      font-weight:
        900;

      line-height:
        1.45;

      word-break:
        break-word;
    }

    .score-box {

      text-align:
        center;
    }

    .score {

      font-size:
        28px;

      font-weight:
        950;

      letter-spacing:
        .5px;
    }

    .match-time {

      color:
        white;

      font-size:
        13px;

      font-weight:
        800;

      margin-top:
        2px;
    }

    .status {

      display:
        inline-block;

      margin-top:
        7px;

      padding:
        4px 9px;

      border-radius:
        20px;

      background:
        #2d3d55;

      color:
        #d4deea;

      font-size:
        10px;

      font-weight:
        900;
    }

    .status.live {

      background:
        var(--green-bg);

      color:
        #7dffca;

      border:
        1px solid
        rgba(22,214,138,.25);
    }

    .status.finished {

      background:
        #313c4e;

      color:
        #bbc7d5;
    }

    /* =========================
       MATCH DETAILS
    ========================= */

    .match-details {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      flex-wrap:
        wrap;

      gap:
        8px 18px;

      margin-top:
        14px;

      padding-top:
        11px;

      border-top:
        1px solid
        rgba(38,61,93,.7);

      color:
        var(--muted);

      font-size:
        11px;
    }

    .channel {

      color:
        #ffd35b;

      font-weight:
        900;
    }

    /* =========================
       EMPTY / LOADING / ERROR
    ========================= */

    .message {

      padding:
        55px 20px;

      text-align:
        center;

      border:
        1px dashed
        var(--border);

      border-radius:
        16px;

      background:
        var(--card);

      color:
        var(--muted);
    }

    .message-icon {

      font-size:
        36px;

      margin-bottom:
        10px;
    }

    .retry {

      margin-top:
        13px;

      padding:
        9px 17px;

      border:
        0;

      border-radius:
        9px;

      background:
        var(--gold);

      color:
        #111;

      font-weight:
        900;

      cursor:
        pointer;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {

      width:
        min(1150px, 94%);

      margin:
        0 auto;

      padding:
        20px 0 35px;

      border-top:
        1px solid
        var(--border);

      color:
        #617894;

      font-size:
        11px;

      text-align:
        center;
    }

    /* =========================
       RTL
    ========================= */

    html[dir="rtl"] .hero {

      flex-direction:
        row;

    }

    /* =========================
       SETTINGS
    ========================= */

    .header-inner {
      position: relative;
    }

    .settings-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      flex: 0 0 auto;
    }

    .settings-btn:hover {
      border-color: var(--gold);
    }

    .settings-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
    }

    .settings-modal.show {
      display: block;
    }

    .settings-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.68);
      backdrop-filter: blur(5px);
    }

    .settings-panel {
      position: relative;
      width: min(520px, 92%);
      margin: 9vh auto 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
      overflow: hidden;
    }

    .settings-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      padding: 20px;
      background: var(--card2);
      border-bottom: 1px solid var(--border);
    }

    .settings-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .settings-header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .settings-close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--card);
      color: white;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .settings-body {
      padding: 8px 20px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(38,61,93,.65);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-row strong,
    .setting-row small {
      display: block;
    }

    .setting-row strong {
      font-size: 14px;
    }

    .setting-row small {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .setting-row select {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg2);
      color: white;
      outline: none;
    }

    .setting-row select:focus {
      border-color: var(--gold);
    }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: rgba(7,17,31,.35);
    }

    .settings-primary,
    .settings-secondary {
      border: 0;
      border-radius: 9px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 900;
    }

    .settings-primary {
      background: var(--gold);
      color: #111;
    }

    .settings-secondary {
      background: var(--card2);
      color: white;
      border: 1px solid var(--border);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .header-inner {

        min-height:
          68px;

      }

      .brand-subtitle {

        display:
          none;

      }

      .brand-title {

        font-size:
          18px;

      }

      .hero {

        align-items:
          flex-start;

        flex-direction:
          column;

      }

      .refresh {

        width:
          100%;
      }

      .match-grid {

        grid-template-columns:
          1fr 80px 1fr;

      }

      .team-logo {

        width:
          46px;

        height:
          46px;
      }

      .team-name {

        font-size:
          13px;
      }

      .score {

        font-size:
          22px;
      }

      .date-nav {

        gap:
          7px;
      }

      .date-button {

        padding:
          11px 5px;
      }

      .date-small {

        font-size:
          10px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-inner">

      <a
        href="/"
        class="brand"
      >

        <div class="brand-icon">
          ⚽
        </div>

        <div>

          <div class="brand-title">
            Modarraj Live
          </div>

          <div
            class="brand-subtitle"
            data-i18n="subtitle"
          >
            Live Football Scores
          </div>

        </div>

      </a>


      <div
        class="language-switch"
        aria-label="Language"
      >

        <button
          id="enBtn"
          class="lang active"
          type="button"
        >
          EN
        </button>

        <button
          id="arBtn"
          class="lang"
          type="button"
        >
          AR
        </button>

      </div>

      <button
        id="settingsBtn"
        class="settings-btn"
        type="button"
        aria-label="Settings"
        title="Settings"
      >
        ⚙️
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>


    <section class="hero">

      <div>

        <h1 data-i18n="title">
          Live Football Scores
        </h1>

        <p data-i18n="description">
          Follow today's most important matches
        </p>

      </div>


      <button
        id="refreshBtn"
        class="refresh"
        type="button"
      >
        ↻
        <span data-i18n="refresh">
          Refresh
        </span>
      </button>

    </section>


    <!-- =========================
         DATE NAV
    ========================= -->

    <nav
      class="date-nav"
      aria-label="Dates"
    >

      <button
        class="date-button"
        data-offset="-1"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="yesterday"
        >
          Yesterday
        </span>

        <span
          class="date-small"
          id="dateMinus"
        >
        </span>

      </button>


      <button
        class="date-button active"
        data-offset="0"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="today"
        >
          Today
        </span>

        <span
          class="date-small"
          id="dateToday"
        >
        </span>

      </button>


      <button
        class="date-button"
        data-offset="1"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="tomorrow"
        >
          Tomorrow
        </span>

        <span
          class="date-small"
          id="datePlus"
        >
        </span>

      </button>

    </nav>


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="summary">

      <span>

        <span data-i18n="matches">
          Matches
        </span>

        :

        <strong id="matchCount">
          0
        </strong>

      </span>


      <span id="selectedDate">
      </span>

    </div>


    <!-- =========================
         LIVE BAR
    ========================= -->

    <div
      id="liveBar"
      class="live-bar"
    >

      <span class="live-dot"></span>

      <span data-i18n="liveNow">
        Live Now
      </span>

    </div>


    <!-- =========================
         MATCHES
    ========================= -->

    <section id="matches">

      <div class="message">

        <div class="message-icon">
          ⏳
        </div>

        <div data-i18n="loading">
          Loading matches...
        </div>

      </div>

    </section>


  </main>


  <!-- =========================
       SETTINGS MODAL
  ========================= -->

  <div
    id="settingsModal"
    class="settings-modal"
    aria-hidden="true"
  >

    <div class="settings-backdrop" id="settingsBackdrop"></div>

    <section
      class="settings-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >

      <div class="settings-header">
        <div>
          <h2 id="settingsTitle" data-i18n="settingsTitle">Settings</h2>
          <p data-i18n="settingsDescription">Customize language, time zone and time format.</p>
        </div>

        <button
          id="settingsClose"
          class="settings-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>
      </div>

      <div class="settings-body">

        <label class="setting-row">
          <span>
            <strong data-i18n="languageSetting">Language</strong>
            <small data-i18n="languageSettingHint">Choose the interface language.</small>
          </span>
          <select id="settingLanguage">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
        </label>

        <label class="setting-row">
          <span>
            <strong data-i18n="timezoneSetting">Time Zone</strong>
            <small data-i18n="timezoneSettingHint">Automatic uses your device time zone.</small>
          </span>
          <select id="settingTimezone"></select>
        </label>

        <label class="setting-row">
          <span>
            <strong data-i18n="timeFormatSetting">Time Format</strong>
            <small data-i18n="timeFormatSettingHint">Choose how match times are displayed.</small>
          </span>
          <select id="settingTimeFormat">
            <option value="24">24-hour</option>
            <option value="12">12-hour</option>
          </select>
        </label>

      </div>

      <div class="settings-footer">
        <button id="settingsReset" class="settings-secondary" type="button" data-i18n="resetSettings">Reset</button>
        <button id="settingsSave" class="settings-primary" type="button" data-i18n="saveSettings">Save</button>
      </div>

    </section>

  </div>


  <footer>

    <span>
      Modarraj Live © 2026
    </span>

  </footer>


  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const API =
      "/api/matches";


    let language =
      localStorage.getItem(
        "modarraj-language"
      ) || "en";


    let currentDate =
      getDateOffset(0);


    const defaultTimezone =
      Intl.DateTimeFormat().resolvedOptions().timeZone ||
      "UTC";


    let appSettings = {
      language: language,
      timezone: localStorage.getItem("modarraj-timezone") || "auto",
      timeFormat: localStorage.getItem("modarraj-time-format") || "24"
    };


    /* =====================================================
       TRANSLATIONS
    ===================================================== */

    const translations = {

      en: {

        subtitle:
          "Live Football Scores",

        title:
          "Live Football Scores",

        description:
          "Follow today's most important matches",

        refresh:
          "Refresh",

        yesterday:
          "Yesterday",

        today:
          "Today",

        tomorrow:
          "Tomorrow",

        matches:
          "Matches",

        liveNow:
          "Live Now",

        loading:
          "Loading matches...",

        noMatches:
          "No matches scheduled for this date.",

        error:
          "Unable to load matches.",

        retry:
          "Try Again",

        important:
          "Important Match",

        notStarted:
          "Not Started",

        live:
          "LIVE",

        halftime:
          "Half Time",

        finished:
          "Finished",

        other:
          "Other",

        venue:
          "Venue",

        location:
          "Location",

        unknownTeam:
          "Unknown Team",

        otherCompetitions:
          "Other Competitions",

        settingsTitle:
          "Settings",

        settingsDescription:
          "Customize language, time zone and time format.",

        languageSetting:
          "Language",

        languageSettingHint:
          "Choose the interface language.",

        timezoneSetting:
          "Time Zone",

    /* =====================================================
       DATE
    ===================================================== */

    function dateObject(offset) {

      const date =
        new Date();

      date.setHours(
        12,
        0,
        0,
        0
      );

      date.setDate(
        date.getDate() +
        offset
      );

      return date;

    }


    function formatApiDate(date) {

      return [
        date.getFullYear(),
        String(
          date.getMonth() + 1
        ).padStart(2, "0"),
        String(
          date.getDate()
        ).padStart(2, "0")
      ].join("-");

    }


    function getDateOffset(offset) {

      return formatApiDate(
        dateObject(offset)
      );

    }


    function formatDisplayDate(date) {

      return date.toLocaleDateString(
        language === "ar"
          ? "ar-SA"
          : "en-US",
        {
          month: "short",
          day: "numeric"
        }
      );

    }

    function escapeHtml(value) {

      return String(
        value ?? ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",

        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",

        );

    }


    /* =====================================================
       MATCH STATUS
    ===================================================== */

    function getMatchStatus(match) {

      const status =
        String(
          match?.fixture?.status?.short ||
          ""
        ).toUpperCase();


      if (
        [
          "LIVE",
          "1H",
          "2H",
          "ET",
          "P"
        ].includes(status)
      ) {

        return {
          text: t("live"),
          className: "live"
        };

      }


      if (
        status === "HT"
      ) {

        return {
          text: t("halftime"),
          className: "live"
        };

      }


      if (
        [
          "FT",
          "FINAL",
          "AET",
          "PEN"
        ].includes(status)
      ) {

        return {
          text: t("finished"),
          className: "finished"
        };

      }


      return {
        text: t("notStarted"),
        className: ""
      };

    }


    /* =====================================================
       MATCH TIME
       Use the visitor's device timezone when the API gives
       a real timestamp. Never invent a timezone for HH:MM.
    ===================================================== */

    function getMatchTime(match) {

      const value =
        match?.fixture?.time ||
        match?.fixture?.date ||
        "";

      if (!value) return "--:--";

      const text = String(value).trim();

      // Full timestamp: convert to selected/device timezone.
      if (
        text.includes("T") ||
        text.endsWith("Z") ||
        /[+-]\d{2}:\d{2}$/.test(text)
      ) {

        const parsed = new Date(text);

        if (!Number.isNaN(parsed.getTime())) {

          const timeZone =
            appSettings.timezone === "auto"
              ? undefined
              : appSettings.timezone;

          return new Intl.DateTimeFormat(
            language === "ar" ? "ar-SA" : "en-US",
            {
              timeZone,
              hour: "2-digit",
              minute: "2-digit",
              hour12: appSettings.timeFormat === "12"
            }
          ).format(parsed);

        }

      }

      // Plain HH:MM[:SS] has no timezone information, so keep it as supplied.
      const timeMatch =
        text.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);

      if (timeMatch) {

        const hour = Number(timeMatch[1]);
        const minute = timeMatch[2];

        if (appSettings.timeFormat === "12") {
          const suffix = hour >= 12 ? (language === "ar" ? "م" : "PM") : (language === "ar" ? "ص" : "AM");
          const displayHour = hour % 12 || 12;
          return `${displayHour}:${minute} ${suffix}`;
        }

        return String(hour).padStart(2, "0") + ":" + minute;

      }

      return "--:--";

    }

    /* =====================================================
       LEAGUE PRIORITY
       Higher number = shown first
    ===================================================== */

    const leaguePriorityRules = [

      // World / major international competitions
      { score: 140, keys: ["fifa world cup", "world cup"] },
      { score: 135, keys: ["uefa champions league", "champions league"] },
      { score: 132, keys: ["uefa europa league", "europa league"] },
      { score: 129, keys: ["conference league", "uefa europa conference"] },

      // Major European leagues
      { score: 125, keys: ["english premier league", "premier league"] },
      { score: 122, keys: ["la liga", "primera division", "spanish la liga"] },
      { score: 119, keys: ["serie a", "italian serie a"] },
      { score: 116, keys: ["bundesliga", "german bundesliga"] },
      { score: 113, keys: ["ligue 1", "french ligue 1"] },

      // Saudi / Arab football
      { score: 108, keys: ["saudi pro league", "saudi professional league", "saudi-arabian pro league"] },
      { score: 106, keys: ["afc champions league elite", "afc champions league"] },
      { score: 102, keys: ["moroccan botola", "botola pro", "botola"] },
      { score: 100, keys: ["egyptian premier league"] },
      { score: 98, keys: ["qatar stars league"] },
      { score: 96, keys: ["uae pro league", "uae league"] },
      { score: 94, keys: ["iraq stars league", "iraqi premier league"] },
      { score: 92, keys: ["kuwait premier league"] },
      { score: 90, keys: ["tunisian ligue 1", "tunisia ligue 1"] },
      { score: 88, keys: ["algeria ligue 1", "algerian ligue 1"] },

      // Other important international competitions
      { score: 86, keys: ["africa cup of nations", "afcon"] },
      { score: 84, keys: ["afc asian cup", "asian cup"] }

    ];


    function normalizeLeagueName(name) {

      return String(name || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

    }


    function getLeaguePriority(name) {

      const value =
        normalizeLeagueName(name);

      for (const rule of leaguePriorityRules) {

        if (rule.keys.some(key => value.includes(key))) {
          return rule.score;
        }

      }

      return 20;

    }


    function getLeagueOrderName(name) {

      const value =
        normalizeLeagueName(name);

      const ruleIndex =
        leaguePriorityRules.findIndex(rule =>
          rule.keys.some(key => value.includes(key))
        );

      return ruleIndex === -1
        ? 999
        : ruleIndex;

    }


    /* =====================================================
       MATCH PRIORITY / ORDER
    ===================================================== */

    function getMatchPriority(match) {

      let score =
        getLeaguePriority(
          match?.league?.name
        );

      const status =
        String(match?.fixture?.status?.short || "").toUpperCase();

      // Live matches always go first.
      if (status === "LIVE") score += 10000;
      else if (status === "HT") score += 9500;

      return score;

    }


    function getMatchTimestamp(match) {

      const value =
        match?.fixture?.time ||
        match?.fixture?.date ||
        "";

      if (!value) return Number.POSITIVE_INFINITY;

      const text = String(value).trim();

      // Full ISO timestamp.
      if (text.includes("T") || text.endsWith("Z") || /[+-]\d{2}:\d{2}$/.test(text)) {

        const parsed = new Date(text).getTime();

        if (Number.isFinite(parsed)) return parsed;

      }

      // Plain HH:MM[:SS]. Sort by minutes from midnight.
      const m = text.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);

      if (m) {
        return Number(m[1]) * 60 + Number(m[2]);
      }

      return Number.POSITIVE_INFINITY;

    }


    function compareMatches(a, b) {

      const priorityA = getMatchPriority(a);
      const priorityB = getMatchPriority(b);

      if (priorityA !== priorityB) {
        return priorityB - priorityA;
      }

      const leagueA = getLeagueOrderName(a?.league?.name);
      const leagueB = getLeagueOrderName(b?.league?.name);

      if (leagueA !== leagueB) {
        return leagueA - leagueB;
      }

      const timeA = getMatchTimestamp(a);
      const timeB = getMatchTimestamp(b);

      if (timeA !== timeB) {
        return timeA - timeB;
      }

      return String(a?.teams?.home?.name || "")
        .localeCompare(
          String(b?.teams?.home?.name || ""),
          undefined,
          { sensitivity: "base" }
        );

    }


    /* =====================================================
       CHANNEL
       IMPORTANT:
       Don't render if unavailable
    ===================================================== */

    function getChannel(match) {

      const channel =
        match?.media?.channel;


      if (
        typeof channel !==
        "string"
      ) {

        return "";

      }


      const value =
        channel.trim();


      if (
        !value ||
        value === "-" ||
        value.toLowerCase() ===
          "null" ||
        value.toLowerCase() ===
          "undefined"
      ) {

        return "";

      }


      return value;

    }


    /* =====================================================
       MATCH CARD
    ===================================================== */

    function renderMatch(match) {

      const home =
        match?.teams?.home ||
        {};

      const away =
        match?.teams?.away ||
        {};


      const status =
        getMatchStatus(
          match
        );


      const homeScore =
        match?.goals?.home;


      const awayScore =
        match?.goals?.away;


      let score =
        "VS";


      if (
        homeScore !== null &&
        homeScore !== undefined &&
        awayScore !== null &&
        awayScore !== undefined
      ) {

        score =
          `${homeScore} - ${awayScore}`;

      }


      const channel =
        getChannel(match);


      const important =
        getLeaguePriority(
          match?.league?.name
        ) >= 88;


      return `

        <article class="match">


          <div class="match-meta">

            <span>
              ${escapeHtml(
                getMatchTime(match)
              )}
            </span>


            ${
              important
                ? `
                  <span class="important">
                    ⭐
                    ${escapeHtml(
                      t("important")
                    )}
                  </span>
                `
                : ""
            }

          </div>


          <div class="match-grid">


            <!-- HOME -->

            <div class="team">

              ${
                home.logo
                  ? `
                    <img
                      class="team-logo"
                      src="${escapeHtml(
                        home.logo
                      )}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }


              <div class="team-name">

                ${escapeHtml(
                  home.name ||
                  t("unknownTeam")
                )}

              </div>

            </div>


            <!-- SCORE -->

            <div class="score-box">

              <div class="score">
                ${escapeHtml(
                  score
                )}
              </div>


              <div class="match-time">

                ${escapeHtml(
                  getMatchTime(match)
                )}

              </div>


              <span
                class="status ${status.className}"
              >

                ${escapeHtml(
                  status.text
                )}

              </span>

            </div>


            <!-- AWAY -->

            <div class="team">

              ${
                away.logo
                  ? `
                    <img
                      class="team-logo"
                      src="${escapeHtml(
                        away.logo
                      )}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }


              <div class="team-name">

                ${escapeHtml(
                  away.name ||
                  t("unknownTeam")
                )}

              </div>

            </div>


          </div>


          <!-- DETAILS -->

          ${
            (
              match?.venue ||
              match?.city ||
              channel
            )
              ? `

                <div class="match-details">


                  ${
                    match?.venue
                      ? `
                        <span>
                          🏟️
                          ${escapeHtml(
                            match.venue
                          )}
                        </span>
                      `
                      : ""
                  }


                  ${
                    match?.city
                      ? `
                        <span>
                          📍
                          ${escapeHtml(
                            match.city
                          )}
                        </span>
                      `
                      : ""
                  }


                  ${
                    channel
                      ? `
                        <span class="channel">
                          📺
                          ${escapeHtml(
                            channel
                          )}
                        </span>
                      `
                      : ""
                  }


                </div>

              `
              : ""
          }


        </article>

      `;

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderMatches(matches) {

      const container =
        document.getElementById(
          "matches"
        );


      const list =
        Array.isArray(matches)
          ? [...matches]
          : [];


      document.getElementById(
        "matchCount"
      ).textContent =
        list.length;


      const liveCount =
        list.filter(
          match =>
            [
              "LIVE",
              "HT"
            ].includes(
              match?.fixture?.status?.short
            )
        ).length;


      const liveBar =
        document.getElementById(
          "liveBar"
        );


      liveBar.classList.toggle(
        "show",
        liveCount > 0
      );


      if (!list.length) {

        container.innerHTML = `

          <div class="message">

            <div class="message-icon">
              ⚽
            </div>

            <div>
              ${escapeHtml(
                t("noMatches")
              )}
            </div>

          </div>

        `;

        return;

      }


      list.sort(compareMatches);


      const groups =
        new Map();


      for (
        const match of list
      ) {

        const league =
          match?.league?.name ||
          t("otherCompetitions");


        if (
          !groups.has(league)
        ) {

          groups.set(
            league,
            []
          );

        }


        groups
          .get(league)
          .push(match);

      }


      container.innerHTML =
        [...groups.entries()]
          .map(
            ([league, matches]) => `

              <section class="league">


                <div
                  class="league-header"
                >

                  <div
                    class="league-name"
                  >

                    <span>
                      🏆
                    </span>

                    <span>
                      ${escapeHtml(
                        league
                      )}
                    </span>

                  </div>


                  <div
                    class="league-count"
                  >

                    ${matches.length}

                  </div>

                </div>


                ${matches
                  .map(
                    renderMatch
                  )
                  .join("")}


              </section>

            `
          )
          .join("");

    }


    /* =====================================================

    async function loadMatches() {

      const container =
        document.getElementById(
          "matches"
        );


      container.innerHTML = `

        <div class="message">

          <div class="message-icon">
            ⏳
          </div>

          <div>
            ${escapeHtml(
              t("loading")
            )}
          </div>

        </div>

      `;


      try {

        const response =
          await fetch(
            `${API}?date=${encodeURIComponent(
              currentDate
            )}`,
            {
              method:
                "GET",

              cache:
                "no-store",

              headers: {
                Accept:
                  "application/json"
              }
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        console.log(
          "Modarraj Live:",
          json
        );


        const matches =
          Array.isArray(
            json.data
          )
            ? json.data
            : [];


        window.currentMatches =
          matches;


        renderMatches(
          matches
        );


      } catch (error) {

        console.error(
          "Modarraj Live error:",
          error
        );


        document.getElementById(
          "matchCount"
        ).textContent =
          "0";


        document.getElementById(
          "liveBar"
        ).classList.remove(
          "show"
        );


        container.innerHTML = `

          <div class="message">

            <div class="message-icon">
              ⚠️
            </div>

            <div>
              ${escapeHtml(
                t("error")
              )}
            </div>

            <button
              class="retry"
              type="button"
              onclick="loadMatches()"
            >
              ${escapeHtml(
                t("retry")
              )}
            </button>

          </div>

        `;

      }

    }

                  offset
                );


              updateDateLabels();


              loadMatches();

            }
          );

        }
      );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    populateTimezoneSelect();
    syncSettingsControls();
    applyLanguage();

    updateDateLabels();

    loadMatches();


    /* =====================================================
       AUTO REFRESH
    ===================================================== */

    setInterval(
      () => {

        /*
          تحديث تلقائي كل دقيقة.
          مفيد للمباريات المباشرة.
        */

        loadMatches();

      },
      60 * 1000
    );


  </script>

</body>

</html>
