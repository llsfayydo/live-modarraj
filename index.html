<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدرج لايف</title>

  <style>
    :root {
      --bg: #06101f;
      --header: #0b1c38;
      --panel: #111f35;
      --panel2: #172d50;
      --border: #263b5a;
      --gold: #f6a000;
      --text: #f5f7fb;
      --muted: #91a4bf;
      --green: #19d38a;
      --red: #ff5b68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(
          180deg,
          #0a1c3a 0%,
          #06101f 45%,
          #050e1a 100%
        );
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      padding: 35px 15px 30px;
      background:
        linear-gradient(
          180deg,
          #112953,
          #071426
        );

      border-bottom: 2px solid var(--gold);
    }

    header h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 900;
    }

    header p {
      margin: 10px 0 15px;
      color: #a9bad3;
      font-size: 17px;
    }

    .server-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 16px;

      border-radius: 22px;

      background: #063c34;
      color: #64efb7;

      font-weight: bold;
    }

    .server-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: var(--green);

      box-shadow: 0 0 10px var(--green);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1080px, 94%);
      margin: 22px auto 50px;
    }

    /* =========================
       DAYS
    ========================= */

    .days {
      display: grid;

      grid-template-columns:
        1fr
        1fr
        1fr;

      gap: 10px;

      margin-bottom: 20px;
    }

    .day-button {
      border: 1px solid var(--border);

      background: #101f35;

      color: #a9bad3;

      padding: 14px;

      border-radius: 15px;

      font-size: 16px;

      cursor: pointer;

      transition: .2s;
    }

    .day-button:hover {
      border-color: var(--gold);
    }

    .day-button.active {
      background: var(--gold);

      color: #111;

      border-color: var(--gold);

      font-weight: 900;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin: 8px 0 15px;

      color: var(--muted);

      font-size: 14px;
    }

    #match-count {
      color: white;

      font-weight: 900;
    }

    /* =========================
       LOADING / EMPTY
    ========================= */

    .loading,
    .empty,
    .error {
      text-align: center;

      padding: 45px 20px;

      border: 1px dashed var(--border);

      border-radius: 18px;

      background: var(--panel);

      color: var(--muted);
    }

    .loading-icon,
    .empty-icon,
    .error-icon {
      font-size: 35px;

      margin-bottom: 10px;
    }

    .error {
      color: #ff9ca5;
    }

    .retry-button {
      margin-top: 15px;

      border: 0;

      background: var(--gold);

      color: #111;

      padding: 10px 20px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 900;
    }

    /* =========================
       LEAGUE
    ========================= */

    .league-section {
      margin-bottom: 22px;

      overflow: hidden;

      border: 1px solid var(--border);

      border-radius: 17px;

      background: rgba(17, 31, 53, .82);
    }

    .league-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding: 14px 17px;

      background: var(--panel2);

      border-right: 4px solid var(--gold);
    }

    .league-name {
      font-weight: 900;

      font-size: 16px;
    }

    .league-count {
      color: var(--muted);

      font-size: 13px;
    }

    /* =========================
       MATCH
    ========================= */

    .match-card {
      padding: 18px 16px;

      border-top: 1px solid var(--border);
    }

    .match-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 16px;

      color: var(--muted);

      font-size: 13px;
    }

    .important {
      padding: 4px 9px;

      border-radius: 12px;

      border: 1px solid #745719;

      color: #ffd45d;

      white-space: nowrap;
    }

    .teams {
      display: grid;

      grid-template-columns:
        1fr
        110px
        1fr;

      align-items: center;

      gap: 10px;
    }

    .team {
      text-align: center;
    }

    .team-logo {
      width: 62px;
      height: 62px;

      object-fit: contain;

      display: block;

      margin: 0 auto 8px;
    }

    .team-name {
      font-size: 17px;

      font-weight: 900;
    }

    .score-area {
      text-align: center;
    }

    .score {
      font-size: 29px;

      font-weight: 900;

      color: white;
    }

    .match-status {
      display: inline-block;

      margin-top: 7px;

      padding: 4px 10px;

      border-radius: 12px;

      background: #293b57;

      color: #c8d3e1;

      font-size: 12px;
    }

    .match-status.live {
      background: #096c4d;

      color: #73ffc4;
    }

    .match-status.finished {
      background: #3b4659;

      color: #d7dfea;
    }

    /* =========================
       DETAILS
    ========================= */

    .match-details {
      display: flex;

      align-items: center;

      justify-content: center;

      flex-wrap: wrap;

      gap: 13px;

      margin-top: 16px;

      padding-top: 12px;

      border-top: 1px solid var(--border);

      color: var(--muted);

      font-size: 13px;
    }

    /*
      القناة تظهر فقط إذا كانت موجودة.
      إذا لم توجد لن يتم إنشاء عنصر القناة أساسًا.
    */

    .channel {
      color: #ffd35e;

      font-weight: 900;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      width: min(1080px, 94%);

      margin: 0 auto 30px;

      padding: 20px;

      border-top: 1px solid var(--border);

      text-align: center;

      color: #657c9d;

      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      header h1 {
        font-size: 29px;
      }

      header p {
        font-size: 14px;
      }

      .teams {
        grid-template-columns:
          1fr
          75px
          1fr;
      }

      .team-logo {
        width: 48px;
        height: 48px;
      }

      .team-name {
        font-size: 14px;
      }

      .score {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <h1>⚽ مدرج لايف</h1>

    <p>
      المباريات الأهم أولاً — مباشرة، قادمة ونتائج اليوم
    </p>

    <div class="server-status">

      <span class="server-dot"></span>

      متصل بالسيرفر

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <!-- الأيام -->

    <div class="days">

      <button
        class="day-button"
        data-offset="-1"
      >
        أمس
      </button>

      <button
        class="day-button active"
        data-offset="0"
      >
        اليوم
      </button>

      <button
        class="day-button"
        data-offset="1"
      >
        غداً
      </button>

    </div>


    <!-- معلومات -->

    <div class="summary">

      <span>
        المباريات:
        <span id="match-count">0</span>
      </span>

      <span id="date-label"></span>

    </div>


    <!-- المباريات -->

    <section id="matches-container">

      <div class="loading">

        <div class="loading-icon">
          ⏳
        </div>

        جاري تحميل المباريات...

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    مدرج لايف © 2026

    <br>

    متابعة المباريات والنتائج المباشرة

  </footer>


  <script>

    /*
     * ==========================================================
     * إعداد API
     * ==========================================================
     *
     * السيرفر عندك يعمل على نفس النطاق.
     *
     * مثال:
     *
     * https://live-modarraj.onrender.com/api/matches?date=2026-08-12
     *
     */

    const API_URL = "/api/matches";


    /*
     * التاريخ الحالي
     */

    let currentDate = formatDate(new Date());


    /*
     * ==========================================================
     * ترتيب البطولات
     * ==========================================================
     *
     * 1 - الدوريات الكبرى
     * 2 - السعودية
     * 3 - المغرب
     * 4 - مصر
     * 5 - الخليج
     * 6 - بقية العرب
     * 7 - بقية أوروبا
     * 8 - بقية العالم
     */

    const LEAGUE_PRIORITY = [

      /* أوروبا الكبرى */

      "UEFA Champions League",
      "Champions League",

      "UEFA Europa League",
      "Europa League",

      "UEFA Conference League",
      "Conference League",

      "Premier League",
      "English Premier League",

      "La Liga",
      "Primera Division",

      "Serie A",

      "Bundesliga",

      "Ligue 1",

      /* السعودية */

      "Saudi Pro League",
      "Saudi Professional League",
      "Saudi League",

      /* المغرب */

      "Botola",
      "Morocco",

      /* مصر */

      "Egyptian Premier League",
      "Egypt",

      /* الإمارات */

      "UAE Pro League",
      "UAE League",
      "United Arab Emirates",

      /* قطر */

      "Qatar Stars League",
      "Qatar",

      /* العراق */

      "Iraqi Premier League",
      "Iraq",

      /* الأردن */

      "Jordanian Pro League",
      "Jordan",

      /* تونس */

      "Tunisian Ligue 1",
      "Tunisia",

      /* الجزائر */

      "Algeria Ligue 1",
      "Algeria",

      /* الكويت */

      "Kuwait Premier League",
      "Kuwait",

      /* عمان */

      "Oman",

      /* البحرين */

      "Bahrain",

      /* البطولات الدولية */

      "World Cup",
      "European Championship",
      "Africa Cup of Nations",
      "Asian Cup"

    ];


    /*
     * ==========================================================
     * تنسيق التاريخ
     * ==========================================================
     */

    function formatDate(date) {

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    /*
     * ==========================================================
     * أمس / اليوم / غداً
     * ==========================================================
     */

    function getDateByOffset(offset) {

      const date =
        new Date();

      date.setDate(
        date.getDate() +
        Number(offset)
      );

      return formatDate(date);
    }


    /*
     * ==========================================================
     * حماية النصوص
     * ==========================================================
     */

    function escapeHtml(value) {

      return String(value ?? "")

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
    }


    /*
     * ==========================================================
     * اسم الدوري
     * ==========================================================
     */

    function getLeagueName(match) {

      return (

        match?.league?.name ||

        match?.league?.originalName ||

        match?.leagueName ||

        "بطولة أخرى"

      );
    }


    /*
     * ==========================================================
     * الدولة
     * ==========================================================
     */

    function getCountry(match) {

      return String(
        match?.league?.country || ""
      ).toLowerCase();
    }


    /*
     * ==========================================================
     * ترتيب الدوري
     * ==========================================================
     */

    function getLeaguePriority(match) {

      const name =
        getLeagueName(match)
          .toLowerCase();

      const country =
        getCountry(match);


      /*
       * البطولات المحددة
       */

      const index =
        LEAGUE_PRIORITY.findIndex(
          league =>
            name.includes(
              league.toLowerCase()
            )
        );


      if (index >= 0) {

        return index;

      }


      /*
       * الدول العربية
       */

      const arabCountries = [

        "saudi",
        "morocco",
        "egypt",
        "qatar",
        "uae",
        "united arab emirates",
        "iraq",
        "jordan",
        "tunisia",
        "algeria",
        "kuwait",
        "oman",
        "bahrain"

      ];


      if (
        arabCountries.some(
          item =>
            country.includes(item)
        )
      ) {

        return 100;

      }


      /*
       * أوروبا
       */

      const europeanCountries = [

        "england",
        "spain",
        "italy",
        "germany",
        "france",
        "netherlands",
        "portugal",
        "belgium",
        "scotland",
        "turkey"

      ];


      if (
        europeanCountries.some(
          item =>
            country.includes(item)
        )
      ) {

        return 150;

      }


      /*
       * بقية العالم
       */

      return 500;

    }


    /*
     * ==========================================================
     * الفريق
     * ==========================================================
     */

    function getTeam(match, side) {

      return (
        match?.teams?.[side] || {}
      );

    }


    function getTeamName(match, side) {

      const team =
        getTeam(match, side);

      return (

        team.name ||

        team.originalName ||

        "غير معروف"

      );

    }


    function getTeamLogo(match, side) {

      return (
        getTeam(match, side).logo ||
        ""
      );

    }


    /*
     * ==========================================================
     * وقت المباراة
     * ==========================================================
     */

    function getFixtureDate(match) {

      return (

        match?.fixture?.date ||

        match?.date ||

        ""

      );

    }


    function getMatchTime(match) {

      const raw =
        getFixtureDate(match);

      if (!raw) {

        return "";

      }


      const date =
        new Date(raw);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "";

      }


      return date.toLocaleTimeString(
        "ar-SA",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
     * ==========================================================
     * حالة المباراة
     * ==========================================================
     */

    function getMatchStatus(match) {

      const short =
        String(

          match?.fixture?.status?.short ||

          match?.status?.short ||

          ""

        ).toUpperCase();


      const elapsed =

        match?.fixture?.status?.elapsed ??

        match?.status?.elapsed;


      /*
       * مباراة مباشرة
       */

      if (

        [
          "LIVE",
          "1H",
          "2H",
          "HT",
          "ET",
          "P",
          "BT"
        ].includes(short)

      ) {

        return {

          text:
            elapsed
              ? `مباشر ${elapsed}'`
              : "مباشر",

          className:
            "live"

        };

      }


      /*
       * انتهت
       */

      if (

        [
          "FT",
          "AET",
          "PEN"
        ].includes(short)

      ) {

        return {

          text: "انتهت",

          className:
            "finished"

        };

      }


      /*
       * حالات خاصة
       */

      if (

        [
          "CANC",
          "ABD",
          "PST",
          "SUSP"
        ].includes(short)

      ) {

        return {

          text:
            "ملغاة/مؤجلة",

          className:
            "finished"

        };

      }


      /*
       * لم تبدأ
       */

      return {

        text: "قريباً",

        className: ""

      };

    }


    /*
     * ==========================================================
     * النتيجة
     * ==========================================================
     */

    function getScore(match) {

      const goals =
        match?.goals || {};


      const home =
        goals.home;

      const away =
        goals.away;


      /*
       * مباراة لم تبدأ
       */

      if (
        home === null ||
        home === undefined ||
        away === null ||
        away === undefined
      ) {

        return "VS";

      }


      return `${home} - ${away}`;

    }


    /*
     * ==========================================================
     * القناة
     * ==========================================================
     *
     * مهم جداً:
     *
     * إذا لم توجد قناة فلن يتم إظهار أي شيء.
     */

    function getChannel(match) {

      const media =
        match?.media || {};


      const candidates = [

        media.channel,

        media.tv,

        media.tvChannel,

        media.broadcast,

        match?.channel,

        match?.tvChannel

      ];


      const channel =
        candidates.find(
          value =>
            typeof value === "string" &&
            value.trim() !== "" &&
            value.trim() !== "-"
        );


      if (!channel) {

        return "";

      }


      return channel.trim();

    }


    /*
     * ==========================================================
     * إنشاء بطاقة المباراة
     * ==========================================================
     */

    function createMatchCard(match) {

      const home =
        getTeamName(
          match,
          "home"
        );


      const away =
        getTeamName(
          match,
          "away"
        );


      const homeLogo =
        getTeamLogo(
          match,
          "home"
        );


      const awayLogo =
        getTeamLogo(
          match,
          "away"
        );


      const status =
        getMatchStatus(match);


      const score =
        getScore(match);


      const time =
        getMatchTime(match);


      const channel =
        getChannel(match);


      const venue =
        match?.venue ||
        match?.fixture?.venue ||
        "";


      const city =
        match?.city ||
        match?.fixture?.city ||
        "";


      const priority =
        Number(
          match?.priority ?? 999
        );


      const leaguePriority =
        getLeaguePriority(match);


      const important =
        priority <= 30 ||
        leaguePriority < 15;


      /*
       * القناة
       *
       * لا ننشئ HTML للقناة إطلاقاً
       * إذا لم تكن متوفرة.
       */

      const channelHtml =
        channel
          ? `
            <span class="channel">
              📺 ${escapeHtml(channel)}
            </span>
          `
          : "";


      const venueHtml =
        venue
          ? `
            <span>
              🏟️ ${escapeHtml(venue)}
            </span>
          `
          : "";


      const cityHtml =
        city
          ? `
            <span>
              📍 ${escapeHtml(city)}
            </span>
          `
          : "";


      return `

        <article class="match-card">

          <div class="match-top">

            <span>
              ${escapeHtml(time)}
            </span>

            ${
              important
                ? `
                  <span class="important">
                    ⭐ مباراة مهمة
                  </span>
                `
                : ""
            }

          </div>


          <div class="teams">


            <!-- الفريق المضيف -->

            <div class="team">

              ${
                homeLogo
                  ? `
                    <img
                      class="team-logo"
                      src="${escapeHtml(homeLogo)}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }

              <div class="team-name">

                ${escapeHtml(home)}

              </div>

            </div>


            <!-- النتيجة -->

            <div class="score-area">

              <div class="score">

                ${escapeHtml(score)}

              </div>


              <span
                class="
                  match-status
                  ${status.className}
                "
              >

                ${escapeHtml(status.text)}

              </span>

            </div>


            <!-- الفريق الضيف -->

            <div class="team">

              ${
                awayLogo
                  ? `
                    <img
                      class="team-logo"
                      src="${escapeHtml(awayLogo)}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }

              <div class="team-name">

                ${escapeHtml(away)}

              </div>

            </div>

          </div>


          <!-- تفاصيل -->

          <div class="match-details">

            ${venueHtml}

            ${cityHtml}

            ${channelHtml}

          </div>

        </article>

      `;

    }


    /*
     * ==========================================================
     * تجميع المباريات حسب الدوري
     * ==========================================================
     */

    function groupMatches(matches) {

      const groups =
        new Map();


      for (
        const match of matches
      ) {

        const league =
          getLeagueName(match);


        if (
          !groups.has(league)
        ) {

          groups.set(
            league,
            []
          );

        }


        groups
          .get(league)
          .push(match);

      }


      return [

        ...groups.entries()

      ].sort(

        (a, b) => {

          return (

            getLeaguePriority(
              a[1][0]
            )

            -

            getLeaguePriority(
              b[1][0]
            )

          );

        }

      );

    }


    /*
     * ==========================================================
     * عرض المباريات
     * ==========================================================
     */

    function renderMatches(matches) {

      const container =
        document.getElementById(
          "matches-container"
        );


      /*
       * لا توجد مباريات
       */

      if (
        !Array.isArray(matches) ||
        matches.length === 0
      ) {

        updateMatchCount(0);


        container.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🏳️
            </div>

            <p>
              لا توجد مباريات مجدولة في هذا التاريخ.
            </p>

          </div>

        `;


        return;

      }


      updateMatchCount(
        matches.length
      );


      /*
       * ترتيب المباريات
       */

      const sorted =
        [...matches].sort(

          (a, b) => {

            /*
             * أولاً أهمية الدوري
             */

            const leagueA =
              getLeaguePriority(a);

            const leagueB =
              getLeaguePriority(b);


            if (
              leagueA !== leagueB
            ) {

              return (
                leagueA -
                leagueB
              );

            }


            /*
             * ثم أولوية المباراة
             */

            const priorityA =
              Number(
                a?.priority ?? 999
              );


            const priorityB =
              Number(
                b?.priority ?? 999
              );


            return (
              priorityA -
              priorityB
            );

          }

        );


      /*
       * تجميع حسب الدوري
       */

      const groups =
        groupMatches(sorted);


      /*
       * بناء الصفحة
       */

      container.innerHTML =

        groups.map(

          ([league, leagueMatches]) => `

            <section class="league-section">


              <div class="league-header">

                <span class="league-name">

                  🏆
                  ${escapeHtml(league)}

                </span>


                <span class="league-count">

                  ${leagueMatches.length}
                  مباراة

                </span>

              </div>


              ${

                leagueMatches
                  .map(
                    createMatchCard
                  )
                  .join("")

              }

            </section>

          `

        ).join("");

    }


    /*
     * ==========================================================
     * عداد المباريات
     * ==========================================================
     */

    function updateMatchCount(count) {

      document.getElementById(
        "match-count"
      ).textContent = count;

    }


    /*
     * ==========================================================
     * عنوان التاريخ
     * ==========================================================
     */

    function updateDateLabel() {

      const active =
        document.querySelector(
          ".day-button.active"
        );


      if (!active) {

        return;

      }


      const offset =
        active.dataset.offset;


      let label =
        "اليوم";


      if (
        offset === "-1"
      ) {

        label = "أمس";

      }


      if (
        offset === "1"
      ) {

        label = "غداً";

      }


      document.getElementById(
        "date-label"
      ).textContent =

        `${label} — ${currentDate}`;

    }


    /*
     * ==========================================================
     * جلب المباريات
     * ==========================================================
     *
     * هذه هي النقطة المهمة في الإصلاح.
     *
     * السيرفر عندك يرجع:
     *
     * {
     *   source: "...",
     *   data: [...],
     *   count: 297,
     *   date: "2026-08-12"
     * }
     *
     * لذلك نقرأ result.data
     */

    async function loadMatches(date) {

      const container =
        document.getElementById(
          "matches-container"
        );


      container.innerHTML = `

        <div class="loading">

          <div class="loading-icon">
            ⏳
          </div>

          جاري تحميل المباريات...

        </div>

      `;


      try {

        /*
         * منع الكاش
         */

        const url =
          `${API_URL}?date=${encodeURIComponent(date)}`;


        const response =
          await fetch(

            url,

            {
              method: "GET",

              headers: {
                "Accept":
                  "application/json"
              },

              cache: "no-store"

            }

          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const result =
          await response.json();


        /*
         * مهم للتأكد من البيانات
         */

        console.log(
          "مدرج لايف - API:",
          result
        );


        /*
         * ======================================================
         * الإصلاح الأساسي
         * ======================================================
         */

        let matches = [];


        /*
         * الشكل الحالي للسيرفر
         */

        if (
          Array.isArray(
            result.data
          )
        ) {

          matches =
            result.data;

        }


        /*
         * دعم احتياطي
         */

        else if (
          Array.isArray(
            result.matches
          )
        ) {

          matches =
            result.matches;

        }


        /*
         * دعم events
         */

        else if (
          Array.isArray(
            result.events
          )
        ) {

          matches =
            result.events;

        }


        /*
         * عرض النتائج
         */

        renderMatches(
          matches
        );


      } catch (error) {

        console.error(
          "خطأ في جلب المباريات:",
          error
        );


        updateMatchCount(0);


        container.innerHTML = `

          <div class="error">

            <div class="error-icon">
              ⚠️
            </div>

            <p>
              تعذر جلب المباريات من السيرفر.
            </p>

            <small>
              ${escapeHtml(
                error.message
              )}
            </small>

            <br>

            <button
              class="retry-button"
              onclick="
                loadMatches(currentDate)
              "
            >
              إعادة المحاولة
            </button>

          </div>

        `;

      }

    }


    /*
     * ==========================================================
     * أزرار الأيام
     * ==========================================================
     */

    document
      .querySelectorAll(
        ".day-button"
      )
      .forEach(

        button => {

          button.addEventListener(
            "click",
            () => {

              /*
               * إزالة التحديد
               */

              document
                .querySelectorAll(
                  ".day-button"
                )
                .forEach(
                  item =>
                    item.classList
                      .remove(
                        "active"
                      )
                );


              /*
               * تحديد الزر
               */

              button.classList.add(
                "active"
              );


              /*
               * التاريخ
               */

              currentDate =
                getDateByOffset(
                  button.dataset.offset
                );


              updateDateLabel();


              /*
               * جلب المباريات
               */

              loadMatches(
                currentDate
              );

            }
          );

        }

      );


    /*
     * ==========================================================
     * التشغيل الأول
     * ==========================================================
     */

    updateDateLabel();


    loadMatches(
      currentDate
    );


    /*
     * ==========================================================
     * تحديث تلقائي كل دقيقة
     * ==========================================================
     */

    setInterval(

      () => {

        loadMatches(
          currentDate
        );

      },

      60000

    );

  </script>

</body>
</html>
