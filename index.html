<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Modarraj Live - Live football scores, fixtures and match information."
  >

  <title>Modarraj Live</title>

  <style>

    :root {
      --bg: #07111f;
      --bg2: #0b1930;
      --card: #101f36;
      --card2: #162944;
      --border: #263d5d;

      --gold: #f5a000;
      --gold2: #ffbd32;

      --text: #f7f9fc;
      --muted: #8fa4bf;

      --green: #16d68a;
      --green-bg: #073f31;

      --red: #ff6978;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #122a4e 0%,
          var(--bg) 45%,
          #050c15 100%
        );

      color: var(--text);

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    select {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--gold2);
      outline-offset: 2px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      background:
        rgba(7, 17, 31, .94);

      backdrop-filter:
        blur(14px);

      border-bottom:
        1px solid
        rgba(245, 160, 0, .35);
    }

    .header-inner {
      width: min(1150px, 94%);
      margin: auto;

      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      text-decoration: none;
      color: white;

      min-width: 0;
    }

    .brand-icon {
      width: 42px;
      height: 42px;

      flex: 0 0 auto;

      border-radius: 12px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold2)
        );

      color: #101010;

      font-size: 22px;

      box-shadow:
        0 5px 20px
        rgba(245, 160, 0, .18);
    }

    .brand-title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -.3px;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .language-switch {
      display: flex;
      gap: 3px;

      padding: 4px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--card);
    }

    .lang {
      border: 0;
      background: transparent;

      color: var(--muted);

      padding: 7px 12px;

      border-radius: 7px;

      font-weight: 800;

      cursor: pointer;
    }

    .lang:hover {
      color: white;
    }

    .lang.active {
      background: var(--gold);
      color: #111;
    }

    .settings-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: white;

      width: 40px;
      height: 40px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 18px;

      flex: 0 0 auto;
    }

    .settings-btn:hover {
      border-color: var(--gold);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1150px, 94%);
      margin: 28px auto 45px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      gap: 20px;

      margin-bottom: 22px;
    }

    .hero h1 {
      margin: 0;

      font-size:
        clamp(26px, 4vw, 38px);

      font-weight: 950;
      letter-spacing: -.7px;
    }

    .hero p {
      margin: 7px 0 0;

      color: var(--muted);

      font-size: 14px;
    }

    .refresh {
      border: 1px solid var(--border);

      background: var(--card);
      color: white;

      padding: 10px 15px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 800;

      white-space: nowrap;

      transition:
        border-color .18s ease,
        transform .18s ease;
    }

    .refresh:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .refresh.loading {
      opacity: .65;
      pointer-events: none;
    }

    .refresh-icon {
      display: inline-block;
      margin-inline-end: 4px;
    }

    .refresh.loading .refresh-icon {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       DATE NAV
    ========================= */

    .date-nav {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom: 24px;
    }

    .date-button {
      border: 1px solid var(--border);

      background: var(--card);

      color: var(--muted);

      border-radius: 13px;

      padding: 13px 10px;

      cursor: pointer;

      font-weight: 800;

      transition: .18s ease;
    }

    .date-button:hover {
      border-color: var(--gold);
      color: white;
    }

    .date-button.active {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
    }

    .date-main {
      display: block;
      font-size: 15px;
    }

    .date-small {
      display: block;

      margin-top: 3px;

      font-size: 11px;

      opacity: .8;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 13px;

      color: var(--muted);

      font-size: 13px;
    }

    .summary strong {
      color: white;
    }

    /* =========================
       LIVE BAR
    ========================= */

    .live-bar {
      display: none;

      margin-bottom: 18px;

      padding: 13px 16px;

      border:
        1px solid
        rgba(22, 214, 138, .3);

      background:
        linear-gradient(
          90deg,
          rgba(7, 63, 49, .9),
          rgba(7, 63, 49, .45)
        );

      border-radius: 13px;

      color: #8fffcf;

      font-weight: 900;
    }

    .live-bar.show {
      display: block;
    }

    .live-dot {
      display: inline-block;

      width: 8px;
      height: 8px;

      margin-inline-end: 8px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 10px
        var(--green);
    }

    /* =========================
       LEAGUE
    ========================= */

    .league {
      overflow: hidden;

      margin-bottom: 20px;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

      background:
        rgba(16, 31, 54, .86);

      box-shadow:
        0 8px 35px
        rgba(0,0,0,.12);
    }

    .league-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 14px 17px;

      background: var(--card2);

      border-inline-start:
        4px solid
        var(--gold);
    }

    .league-name {
      display: flex;
      align-items: center;

      gap: 9px;

      min-width: 0;

      font-size: 16px;
      font-weight: 900;
    }

    .league-name-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .league-count {
      color: var(--muted);
      font-size: 12px;
      flex: 0 0 auto;
    }

    /* =========================
       MATCH
    ========================= */

    .match {
      border-top:
        1px solid
        var(--border);

      padding: 17px 15px;
    }

    .match-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      color: var(--muted);

      font-size: 11px;

      margin-bottom: 15px;
    }

    .match-meta-left,
    .match-meta-right {
      display: flex;
      align-items: center;
      gap: 8px;

      min-width: 0;
    }

    .match-meta-right span {
      overflow-wrap: anywhere;
      text-align: end;
    }

    .match-grid {
      display: grid;

      grid-template-columns:
        1fr 130px 1fr;

      align-items: center;

      gap: 10px;
    }

    .team {
      min-width: 0;
      text-align: center;
    }

    .team-logo {
      display: block;

      width: 58px;
      height: 58px;

      margin: 0 auto 8px;

      object-fit: contain;
    }

    .team-name {
      font-size: 15px;
      font-weight: 900;

      line-height: 1.45;

      overflow-wrap: anywhere;
    }

    .score-box {
      text-align: center;
    }

    .score {
      font-size: 28px;

      font-weight: 950;

      letter-spacing: .5px;
    }

    .match-time {
      color: white;

      font-size: 13px;

      font-weight: 800;

      margin-top: 2px;
    }

    .status {
      display: inline-block;

      margin-top: 7px;

      padding: 4px 9px;

      border-radius: 20px;

      background: #2d3d55;

      color: #d4deea;

      font-size: 10px;

      font-weight: 900;
    }

    .status.live {
      background: var(--green-bg);

      color: #7dffca;

      border:
        1px solid
        rgba(22,214,138,.25);
    }

    .status.finished {
      background: #313c4e;
      color: #bbc7d5;
    }

    /* =========================
       MATCH DETAILS
    ========================= */

    .match-details {
      display: flex;

      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: 8px 18px;

      margin-top: 14px;

      padding-top: 11px;

      border-top:
        1px solid
        rgba(38,61,93,.7);

      color: var(--muted);

      font-size: 11px;

      text-align: center;
    }

    .channel {
      color: #ffd35b;
      font-weight: 900;
    }

    /* =========================
       EMPTY / LOADING / ERROR
    ========================= */

    .message {
      padding: 55px 20px;

      text-align: center;

      border:
        1px dashed
        var(--border);

      border-radius: 16px;

      background: var(--card);

      color: var(--muted);
    }

    .message-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .retry {
      margin-top: 13px;

      padding: 9px 17px;

      border: 0;

      border-radius: 9px;

      background: var(--gold);

      color: #111;

      font-weight: 900;

      cursor: pointer;
    }

    .retry:hover {
      background: var(--gold2);
    }

    /* =========================
       CONTACT
    ========================= */

    .site-footer {
      width: min(1150px, 94%);

      margin:
        0 auto 30px;

      padding:
        22px 24px;

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      background:
        rgba(16, 31, 54, .78);

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      flex-wrap: wrap;
    }

    .footer-copy h3 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .footer-copy p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;
    }

    .footer-actions {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }

    .footer-link {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 42px;

      padding: 10px 15px;

      border-radius: 10px;

      border:
        1px solid
        var(--border);

      background: var(--card);

      color: white;

      text-decoration: none;

      font-weight: 800;

      transition: .18s ease;
    }

    .footer-link:hover {
      border-color: var(--gold);
      color: var(--gold2);

      transform: translateY(-1px);
    }

    .footer-link.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #111;
    }

    .footer-link.primary:hover {
      color: #111;
      background: var(--gold2);
    }

    /* =========================
       SETTINGS
    ========================= */

    .settings-modal {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      overflow-y: auto;
    }

    .settings-modal.show {
      display: block;
    }

    .settings-backdrop {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.68);

      backdrop-filter:
        blur(5px);
    }

    .settings-panel {
      position: relative;

      width:
        min(560px, 92%);

      margin:
        9vh auto 30px;

      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        18px;

      box-shadow:
        0 25px 80px
        rgba(0,0,0,.45);

      overflow:
        hidden;
    }

    .settings-header {
      display: flex;

      align-items: flex-start;

      justify-content:
        space-between;

      gap: 15px;

      padding: 20px;

      background:
        var(--card2);

      border-bottom:
        1px solid
        var(--border);
    }

    .settings-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .settings-header p {
      margin: 6px 0 0;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.6;
    }

    .settings-close {
      width: 34px;
      height: 34px;

      border:
        1px solid
        var(--border);

      border-radius: 9px;

      background: var(--card);

      color: white;

      cursor: pointer;

      font-size: 22px;

      line-height: 1;
    }

    .settings-body {
      padding: 8px 20px;
    }

    .setting-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      padding: 16px 0;

      border-bottom:
        1px solid
        rgba(38,61,93,.65);
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-row strong,
    .setting-row small {
      display: block;
    }

    .setting-row strong {
      font-size: 14px;
    }

    .setting-row small {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;

      line-height: 1.5;
    }

    .setting-row select {
      min-width: 190px;

      padding: 10px 12px;

      border:
        1px solid
        var(--border);

      border-radius: 9px;

      background:
        var(--bg2);

      color: white;

      outline: none;
    }

    .setting-row select:focus {
      border-color: var(--gold);
    }

    .settings-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      padding: 16px 20px;

      border-top:
        1px solid
        var(--border);

      background:
        rgba(7,17,31,.35);
    }

    .settings-primary,
    .settings-secondary {
      border: 0;

      border-radius: 9px;

      padding: 10px 18px;

      cursor: pointer;

      font-weight: 900;
    }

    .settings-primary {
      background: var(--gold);
      color: #111;
    }

    .settings-primary:hover {
      background: var(--gold2);
    }

    .settings-secondary {
      background: var(--card2);
      color: white;

      border:
        1px solid
        var(--border);
    }

    /* =========================
       RTL
    ========================= */

    html[dir="rtl"] .match-meta {
      direction: rtl;
    }

    html[dir="rtl"] .settings-footer {
      justify-content: flex-start;
    }

    html[dir="rtl"] .league-header {
      border-inline-start: 0;
      border-inline-end: 4px solid var(--gold);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .header-inner {
        min-height: 68px;
      }

      .brand-subtitle {
        display: none;
      }

      .brand-title {
        font-size: 18px;
      }

      .language-switch {
        display: none;
      }

      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .refresh {
        width: 100%;
      }

      .match-grid {
        grid-template-columns:
          1fr 80px 1fr;
      }

      .team-logo {
        width: 46px;
        height: 46px;
      }

      .team-name {
        font-size: 13px;
      }

      .score {
        font-size: 22px;
      }

      .date-nav {
        gap: 7px;
      }

      .date-button {
        padding: 11px 5px;
      }

      .date-small {
        font-size: 10px;
      }

      .setting-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .setting-row select {
        width: 100%;
        min-width: 0;
      }

      .settings-footer {
        flex-direction: column;
      }

      .settings-primary,
      .settings-secondary {
        width: 100%;
      }

      .site-footer {
        padding: 18px;
      }

      .footer-actions {
        width: 100%;
      }

      .footer-link {
        flex: 1;
      }

      .match-meta {
        align-items: flex-start;
      }

      .match-meta-right {
        text-align: end;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-inner">

      <a
        href="/"
        class="brand"
        aria-label="Modarraj Live"
      >

        <div class="brand-icon">
          ⚽
        </div>

        <div>

          <div class="brand-title">
            Modarraj Live
          </div>

          <div
            class="brand-subtitle"
            data-i18n="subtitle"
          >
            Live Football Scores
          </div>

        </div>

      </a>

      <div class="header-actions">

        <div
          class="language-switch"
          aria-label="Language"
        >

          <button
            id="enBtn"
            class="lang"
            type="button"
            aria-label="English"
          >
            EN
          </button>

          <button
            id="arBtn"
            class="lang"
            type="button"
            aria-label="Arabic"
          >
            AR
          </button>

        </div>

        <button
          id="settingsBtn"
          class="settings-btn"
          type="button"
          aria-label="Settings"
          title="Settings"
        >
          ⚙️
        </button>

      </div>

    </div>

  </header>

  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <section class="hero">

      <div>

        <h1 data-i18n="title">
          Live Football Scores
        </h1>

        <p data-i18n="description">
          Follow today's matches
        </p>

      </div>

      <button
        id="refreshBtn"
        class="refresh"
        type="button"
      >
        <span
          class="refresh-icon"
          aria-hidden="true"
        >
          ↻
        </span>

        <span data-i18n="refresh">
          Refresh
        </span>
      </button>

    </section>

    <!-- DATE -->

    <nav
      class="date-nav"
      aria-label="Dates"
    >

      <button
        class="date-button"
        data-offset="-1"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="yesterday"
        >
          Yesterday
        </span>

        <span
          class="date-small"
          id="dateMinus"
        ></span>

      </button>

      <button
        class="date-button active"
        data-offset="0"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="today"
        >
          Today
        </span>

        <span
          class="date-small"
          id="dateToday"
        ></span>

      </button>

      <button
        class="date-button"
        data-offset="1"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="tomorrow"
        >
          Tomorrow
        </span>

        <span
          class="date-small"
          id="datePlus"
        ></span>

      </button>

    </nav>

    <!-- SUMMARY -->

    <div class="summary">

      <span>

        <span data-i18n="matches">
          Matches
        </span>

        :

        <strong id="matchCount">
          0
        </strong>

      </span>

      <span id="selectedDate"></span>

    </div>

    <!-- LIVE -->

    <div
      id="liveBar"
      class="live-bar"
      aria-live="polite"
    >

      <span class="live-dot"></span>

      <span data-i18n="liveNow">
        Live Now
      </span>

    </div>

    <!-- MATCHES -->

    <section
      id="matches"
      aria-live="polite"
    >

      <div class="message">

        <div class="message-icon">
          ⏳
        </div>

        <div data-i18n="loading">
          Loading matches...
        </div>

      </div>

    </section>

  </main>

  <!-- =========================
       CONTACT / ADVERTISING
  ========================= -->

  <footer class="site-footer">

    <div class="footer-copy">

      <h3 data-i18n="contactTitle">
        Contact & Advertising
      </h3>

      <p data-i18n="contactDescription">
        For advertising, partnerships or contacting the Modarraj Live team.
      </p>

    </div>

    <div class="footer-actions">

      <a
        class="footer-link primary"
        href="mailto:llsfayydo@gmail.com?subject=Modarraj%20Live%20Advertising"
        data-i18n="advertiseLink"
      >
        Advertise
      </a>

      <a
        class="footer-link"
        href="mailto:llsfayydo@gmail.com?subject=Modarraj%20Live%20Contact"
        data-i18n="contactLink"
      >
        Contact Us
      </a>

    </div>

  </footer>

  <!-- =========================
       SETTINGS
  ========================= -->

  <div
    id="settingsModal"
    class="settings-modal"
    aria-hidden="true"
  >

    <div
      class="settings-backdrop"
      id="settingsBackdrop"
    ></div>

    <section
      class="settings-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >

      <div class="settings-header">

        <div>

          <h2
            id="settingsTitle"
            data-i18n="settingsTitle"
          >
            Settings

    /* =====================================================

    ===================================================== */

    function getActiveTimezone() {

      const timezone =
        appSettings.timezone;


      if (
        timezone === "auto"
      ) {

        return browserTimezone;

      }


      return isValidTimezone(timezone)
        ? timezone
        : browserTimezone;

    }


    function getTimeZoneParts(
      date = new Date()
    ) {

      const formatter =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone:
              getActiveTimezone(),

            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }
        );


      const parts =
        formatter.formatToParts(date);


      const result = {};


      for (
        const part
        of parts
      ) {

        if (
          part.type !== "literal"
        ) {

          result[part.type] =
            part.value;

        }

      }


      return result;

    }


    function dateObject(
      offset = 0
    ) {

      const parts =
        getTimeZoneParts(
          new Date()
        );


      const year =
        Number(parts.year);

      const month =
        Number(parts.month) - 1;

      const day =
        Number(parts.day);


      return new Date(
        Date.UTC(
          year,
          month,
          day + offset,
          12,
          0,
          0
        )
      );

    }


    function formatApiDate(date) {

      return [

        date.getUTCFullYear(),

        String(
          date.getUTCMonth() + 1
        ).padStart(2, "0"),

        String(
          date.getUTCDate()
        ).padStart(2, "0")

      ].join("-");

    }


    function getDateOffset(
      offset
    ) {

      return formatApiDate(
        dateObject(offset)
      );

    }


    let currentDate =
      getDateOffset(0);


    function formatDisplayDate(
      date
    ) {

      return new Intl.DateTimeFormat(

        language === "ar"
          ? "ar-SA"
          : "en-US",

        {
          timeZone:
            getActiveTimezone(),

          month: "short",

          day: "numeric"
        }

      ).format(date);

    }

    function escapeHtml(

    ) {

      return String(
        value ?? ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    function safeImageUrl(
      value
    ) {

      if (
        typeof value !== "string"
      ) {

        return "";

      }


      const url =
        value.trim();


      if (!url) {

        return "";

      }


      try {

        const parsed =
          new URL(
            url,
            window.location.origin
          );


        if (
          parsed.protocol !== "http:" &&
          parsed.protocol !== "https:"
        ) {

          return "";

        }


        return parsed.href;

      } catch {

        return "";

      }

    }


    /* =====================================================
       TIMESTAMP
    ===================================================== */

    function parseMatchDate(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return null;

      }


      if (
        typeof value === "number" ||
        /^\d+$/.test(
          String(value).trim()
        )
      ) {

        const number =
          Number(value);


        if (
          !Number.isFinite(number)
        ) {

          return null;

        }


        const milliseconds =
          number < 100000000000
            ? number * 1000
            : number;


        const date =
          new Date(
            milliseconds
          );


        return Number.isNaN(
          date.getTime()
        )
          ? null
          : date;

      }


      const text =
        String(value).trim();


      if (!text) {

        return null;

      }


      /*
        ISO timestamps with timezone.
      */

      if (
        text.includes("T") ||
        text.endsWith("Z") ||
        /[+-]\d{2}:?\d{2}$/.test(text)
      ) {

        const parsed =
          new Date(text);


        if (
          !Number.isNaN(
            parsed.getTime()
          )
        ) {

          return parsed;

        }

      }


      /*
        Date-only value:
        YYYY-MM-DD
      */

      if (
        /^\d{4}-\d{2}-\d{2}$/.test(text)
      ) {

        const parsed =
          new Date(
            `${text}T12:00:00Z`
          );


        if (
          !Number.isNaN(
            parsed.getTime()
          )
        ) {

          return parsed;

        }

      }


      return null;

    }


    function getMatchTime(
      match
    ) {

      const value =
        match?.fixture?.timestamp ??
        match?.fixture?.date ??
        match?.fixture?.time ??
        "";


      if (
        value === "" ||
        value === null ||
        value === undefined
      ) {

        return "--:--";

      }


      const parsed =
        parseMatchDate(value);


      if (parsed) {

        return new Intl.DateTimeFormat(

          language === "ar"
            ? "ar-SA"
            : "en-US",

          {
            timeZone:
              getActiveTimezone(),

            hour: "2-digit",

            minute: "2-digit",

            hour12:
              appSettings.timeFormat === "12"
          }

        ).format(parsed);

      }


      const text =
        String(value).trim();


      const timeMatch =
        text.match(
          /^(\d{1,2}):(\d{2})(?::\d{2})?$/
        );


      if (timeMatch) {

        const hour =
          Number(
            timeMatch[1]
          );

        const minute =
          timeMatch[2];


        if (
          hour < 0 ||
          hour > 23
        ) {

          return "--:--";

        }


        if (
          appSettings.timeFormat === "12"
        ) {

          const suffix =
            hour >= 12
              ? (
                  language === "ar"
                    ? "م"
                    : "PM"
                )
              : (
                  language === "ar"
                    ? "ص"
                    : "AM"
                );


          const displayHour =
            hour % 12 || 12;


          return (
            `${displayHour}:${minute} ${suffix}`
          );

        }


        return (
          `${String(hour).padStart(2, "0")}:${minute}`
        );

      }


      return "--:--";

    }


    /* =====================================================
       MATCH STATUS
    ===================================================== */

    function getStatusCode(
      match
    ) {

      return String(
        match?.fixture?.status?.short ||
        ""
      ).toUpperCase();

    }


    function isLiveMatch(
      match
    ) {

      const status =
        getStatusCode(match);


      return [

        "LIVE",
        "1H",
        "2H",
        "ET",
        "P",
        "BT",
        "INT",
        "HT"

      ].includes(status);

    }


    function isFinishedMatch(
      match
    ) {

      const status =
        getStatusCode(match);


      return [

        "FT",
        "FINAL",
        "AET",
        "PEN"

      ].includes(status);

    }


    function getMatchStatus(
      match
    ) {

      const status =
        getStatusCode(match);


      if (
        isLiveMatch(match)
      ) {

        if (
          status === "HT"
        ) {

          return {

            text:
              t("halftime"),

            className:
              "live"

          };

        }


        return {

          text:
            t("live"),

          className:
            "live"

        };

      }


      if (
        isFinishedMatch(match)
      ) {

        return {

          text:
            t("finished"),

          className:
            "finished"

        };

      }


      return {

        text:
          t("notStarted"),

        className:
          ""

      };

    }

    function normalizeLeagueName(
      name
    ) {

      return String(
        name || ""
      )
        .trim()
        .toLowerCase()
        .replace(
          /\s+/g,
          " "
        );

    }


    function isWomenCompetition(
      name
    ) {

      const value =
        normalizeLeagueName(name);


      return /\b(women|women's|womens|female|ladies|feminine|frauen|femminile|liga f|wsl)\b/
        .test(value);

    }


    function isYouthCompetition(
      name
    ) {

      const value =
        normalizeLeagueName(name);


      return /\b(u[0-9]{1,2}|under[- ]?[0-9]{1,2}|youth|junior|reserve|reserves|academy|2nd|3rd)\b/
        .test(value);

    }


    function getCompetitionType(
      name
    ) {

      if (
        isWomenCompetition(name)
      ) {

        return "women";

      }


      if (
        isYouthCompetition(name)
      ) {

        return "youth";

      }


      const value =
        normalizeLeagueName(name);


      const isMain =
        leaguePriorityRules.some(
          rule =>
            rule.keys.some(
              key =>
                value.includes(key)
            )
        );


      return isMain
        ? "main"
        : "other";

    }


    function competitionIsVisible(
      match
    ) {

      const type =
        getCompetitionType(
          match?.league?.name
        );


      switch (
        appSettings.competitionFilter
      ) {

        case "women":
          return type === "women";

        case "youth":
          return type === "youth";

        case "other":
          return type === "other";

        case "all":
          return true;

        case "main":
        default:
          return type === "main";

      }

    }


    function getLeaguePriority(
      name
    ) {

      const value =
        normalizeLeagueName(name);


      if (
        isWomenCompetition(value)
      ) {

        return 5;

      }


      if (
        isYouthCompetition(value)
      ) {

        return 4;

      }


      for (
        const rule
        of leaguePriorityRules
      ) {

        if (
          rule.keys.some(
            key =>
              value.includes(key)
          )
        ) {

          return rule.score;

        }

      }


      return 20;

    }


    /* =====================================================
       MATCH SORTING
    ===================================================== */

    function getMatchTimestamp(
      match
    ) {

      const value =
        match?.fixture?.timestamp ??
        match?.fixture?.date ??
        match?.fixture?.time ??
        "";


      const parsed =
        parseMatchDate(value);


      if (parsed) {

        return parsed.getTime();

      }


      const text =
        String(
          value || ""
        ).trim();


      const m =
        text.match(
          /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/
        );


      if (m) {

        return (

          Number(m[1]) *
            3600000 +

          Number(m[2]) *
            60000 +

          Number(m[3] || 0) *
            1000

        );

      }


      return Number.POSITIVE_INFINITY;

    }


    function getStatusOrder(
      match
    ) {

      if (
        isLiveMatch(match)
      ) {

        return 0;

      }


      if (
        isFinishedMatch(match)
      ) {

        return 2;

      }


      return 1;

    }


    function compareMatches(
      a,
      b
    ) {

      const statusA =
        getStatusOrder(a);

      const statusB =
        getStatusOrder(b);


      if (
        statusA !== statusB
      ) {

        return (
          statusA -
          statusB
        );

      }


      const priorityA =
        getLeaguePriority(
          a?.league?.name
        );


      const priorityB =
        getLeaguePriority(
          b?.league?.name
        );


      if (
        priorityA !== priorityB
      ) {

        return (
          priorityB -
          priorityA
        );

      }


      const timeA =
        getMatchTimestamp(a);


      const timeB =
        getMatchTimestamp(b);


      if (
        timeA !== timeB
      ) {

        return (
          timeA -
          timeB
        );

      }


      return String(
        a?.teams?.home?.name || ""
      ).localeCompare(

        String(
          b?.teams?.home?.name || ""
        ),

        undefined,

        {
          sensitivity:
            "base"
        }

      );

    }


    /* =====================================================
       CHANNEL
    ===================================================== */

    function getChannel(
      match
    ) {

      const channel =
        match?.media?.channel;


      if (
        typeof channel !== "string"
      ) {

        return "";

      }


      const value =
        channel.trim();


      if (
        !value ||
        value === "-" ||
        value.toLowerCase() === "null" ||
        value.toLowerCase() === "undefined"
      ) {

        return "";

      }


      return value;

    }

    /* =====================================================
       RENDER
    ===================================================== */

    function renderMatches(
      matches
    ) {

      const container =
        document.getElementById(
          "matches"
        );


      const list =
        (
          Array.isArray(matches)
            ? [...matches]
            : []
        )
        .filter(
          match =>
            match &&
            typeof match === "object"
        )
        .filter(
          competitionIsVisible
        );


      document.getElementById(
        "matchCount"
      ).textContent =
        list.length;


      const liveCount =
        list.filter(
          isLiveMatch
        ).length;


      document.getElementById(
        "liveBar"
      ).classList.toggle(
        "show",
        liveCount > 0
      );


      if (
        !list.length
      ) {

        container.innerHTML = `

          <div class="message">

            <div class="message-icon">
              ⚽
            </div>

            <div>
              ${escapeHtml(
                t("noMatches")
              )}
            </div>

          </div>

        `;

        return;

      }


      list.sort(
        compareMatches
      );


      const groups =
        new Map();


      for (
        const match
        of list
      ) {

        const league =
          match?.league?.name ||
          t("otherCompetitions");


        if (
          !groups.has(league)
        ) {

          groups.set(
            league,
            []
          );

        }


        groups
          .get(league)
          .push(match);

      }


      container.innerHTML =
        [...groups.entries()]
          .map(
            (
              [
                league,
                leagueMatches
              ]
            ) => `

              <section class="league">

                <div class="league-header">

                  <div class="league-name">

                    <span aria-hidden="true">
                      🏆
                    </span>

                    <span class="league-name-text">
                      ${escapeHtml(
                        league
                      )}
                    </span>

                  </div>

                  <div class="league-count">

                    ${leagueMatches.length}

                  </div>

                </div>

                ${leagueMatches
                  .map(
                    renderMatch
                  )
                  .join("")}

              </section>

            `
          )
          .join("");

    }


    /* =====================================================
       LOAD MATCHES
       Prevent stale requests from overwriting
       newer requests.
    ===================================================== */

    let loadingMatches =
      false;


    let requestSequence =
      0;


    async function loadMatches(
      options = {}
    ) {

      if (
        loadingMatches
      ) {

        return;

      }


      loadingMatches =
        true;


      const requestId =
        ++requestSequence;


      const preserveScroll =
        options.preserveScroll === true;


      const savedScrollY =
        preserveScroll
          ? window.scrollY
          : 0;


      const container =
        document.getElementById(
          "matches"
        );


      const refreshBtn =
        document.getElementById(
          "refreshBtn"
        );


      const previousHeight =
        container.offsetHeight;


      if (
        preserveScroll
      ) {

        container.style.minHeight =
          `${Math.max(
            previousHeight,
            1
          )}px`;

      }


      if (
        !window.currentMatches ||
        !preserveScroll
      ) {

        container.innerHTML = `

          <div class="message">

            <div class="message-icon">
              ⏳
            </div>

            <div>
              ${escapeHtml(
                t("loading")
              )}
            </div>

          </div>

        `;

      }


      refreshBtn.classList.add(
        "loading"
      );


      try {

        subscribeSocket();

        const response =
          await fetch(

            `${API}?date=${encodeURIComponent(
              currentDate
            )}&tz=${encodeURIComponent(getActiveTimezone())}`,

            {
              method:
                "GET",

              cache:
                "no-store",

              headers: {
                Accept:
                  "application/json"
              }

            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        console.log(
          "Modarraj Live:",
          json
        );


        /*
          Ignore a response belonging
          to an older request.
        */

        if (
          requestId !==
          requestSequence
        ) {

          return;

        }


        let matches = [];


        if (
          Array.isArray(
            json?.data
          )
        ) {

          matches =
            json.data;

        } else if (
          Array.isArray(json)
        ) {

          /*
            Also support an API that
            directly returns an array.
          */

          matches =
            json;

        } else if (
          Array.isArray(
            json?.matches
          )
        ) {

          /*
            Support:
            { matches: [...] }
          */

          matches =
            json.matches;

        }


        window.currentMatches =
          matches;


        renderMatches(
          matches
        );


      } catch (error) {

        console.error(
          "Modarraj Live error:",
          error
        );


        /*
          Do not show an error from
          an outdated request.
        */

        if (
          requestId !==
          requestSequence
        ) {

          return;

        }


        if (
          !preserveScroll ||
          !window.currentMatches
        ) {

          document.getElementById(
            "matchCount"
          ).textContent =
            "0";


          document.getElementById(
            "liveBar"
          ).classList.remove(
            "show"
          );


          container.innerHTML = `

            <div class="message">

              <div class="message-icon">
                ⚠️
              </div>

              <div>
                ${escapeHtml(
                  t("error")
                )}
              </div>

              <button
                class="retry"
                type="button"
                id="retryButton"
              >
                ${escapeHtml(
                  t("retry")
                )}
              </button>

            </div>

          `;


          document
            .getElementById(
              "retryButton"
            )
            ?.addEventListener(
              "click",
              () => {

                loadMatches();

              }
            );

        }

      } finally {

        /*
          Only the latest request controls
          the loading state.
        */

        if (
          requestId ===
          requestSequence
        ) {

          loadingMatches =
            false;


          refreshBtn.classList.remove(
            "loading"
          );


          if (
            preserveScroll
          ) {

            requestAnimationFrame(
              () => {

                window.scrollTo(
                  0,
                  savedScrollY
                );


                container.style.minHeight =
                  "";

              }
            );

          }

        }

      }

    }

    /* =====================================================
       REAL-TIME SOCKET UPDATES
    ===================================================== */

    const socket =
      typeof io === "function"
        ? io({ transports: ["websocket", "polling"] })
        : null;

    socket?.on("matchUpdate", payload => {

      if (!payload || payload.date !== currentDate) return;
      if (payload.timezone && payload.timezone !== getActiveTimezone()) return;

      if (!Array.isArray(payload.matches)) return;

      window.currentMatches = payload.matches;
      renderMatches(payload.matches);

        timezone: getActiveTimezone()

       AUTO REFRESH FALLBACK
       Socket.IO handles live updates. This remains as a lightweight
       fallback for fixtures/status changes when the socket is unavailable.
    ===================================================== */

    setInterval(
      () => {
        if (document.visibilityState !== "visible") return;

        loadMatches({
          preserveScroll: true
        });
      },
      60 * 1000
    );

  </script>

</body>
