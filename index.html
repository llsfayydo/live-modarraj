<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Modarraj Live - Live football scores, fixtures and match information."
  >

  <title>Modarraj Live</title>

  <style>

    :root {
      --bg: #07111f;
      --bg2: #0b1930;
      --card: #101f36;
      --card2: #162944;
      --border: #263d5d;

      --gold: #f5a000;
      --gold2: #ffbd32;

      --text: #f7f9fc;
      --muted: #8fa4bf;

      --green: #16d68a;
      --green-bg: #073f31;

      --red: #ff6978;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #122a4e 0%,
          var(--bg) 45%,
          #050c15 100%
        );

      color: var(--text);

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
    }

    button {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {

      position: sticky;

      top: 0;

      z-index: 100;

      background:
        rgba(7, 17, 31, .94);

      backdrop-filter:
        blur(14px);

      border-bottom:
        1px solid
        rgba(245, 160, 0, .35);
    }

    .header-inner {

      width:
        min(1150px, 94%);

      margin:
        auto;

      min-height:
        76px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap: 20px;
    }

    .brand {

      display:
        flex;

      align-items:
        center;

      gap: 12px;

      text-decoration:
        none;

      color:
        white;
    }

    .brand-icon {

      width: 42px;

      height: 42px;

      border-radius: 12px;

      display:
        grid;

      place-items:
        center;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          var(--gold2)
        );

      color:
        #101010;

      font-size: 22px;

      box-shadow:
        0 5px 20px
        rgba(245, 160, 0, .18);
    }

    .brand-title {

      font-size: 21px;

      font-weight: 900;

      letter-spacing:
        -.3px;
    }

    .brand-subtitle {

      color:
        var(--muted);

      font-size: 11px;

      margin-top: 2px;
    }

    .language-switch {

      display:
        flex;

      gap: 3px;

      padding: 4px;

      border:
        1px solid
        var(--border);

      border-radius: 10px;

      background:
        var(--card);
    }

    .lang {

      border: 0;

      background:
        transparent;

      color:
        var(--muted);

      padding:
        7px 12px;

      border-radius: 7px;

      font-weight: 800;

      cursor: pointer;
    }

    .lang.active {

      background:
        var(--gold);

      color:
        #111;
    }

    /* =========================
       MAIN
    ========================= */

    main {

      width:
        min(1150px, 94%);

      margin:
        28px auto 60px;
    }

    .hero {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap: 20px;

      margin-bottom:
        22px;
    }

    .hero h1 {

      margin: 0;

      font-size:
        clamp(26px, 4vw, 38px);

      font-weight:
        950;

      letter-spacing:
        -.7px;
    }

    .hero p {

      margin:
        7px 0 0;

      color:
        var(--muted);

      font-size:
        14px;
    }

    .refresh {

      border:
        1px solid
        var(--border);

      background:
        var(--card);

      color:
        white;

      padding:
        10px 15px;

      border-radius:
        10px;

      cursor:
        pointer;

      font-weight:
        800;
    }

    .refresh:hover {

      border-color:
        var(--gold);

    }

    /* =========================
       DATE NAV
    ========================= */

    .date-nav {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom:
        24px;
    }

    .date-button {

      border:
        1px solid
        var(--border);

      background:
        var(--card);

      color:
        var(--muted);

      border-radius:
        13px;

      padding:
        13px 10px;

      cursor:
        pointer;

      font-weight:
        800;

      transition:
        .18s ease;
    }

    .date-button:hover {

      border-color:
        var(--gold);

      color:
        white;
    }

    .date-button.active {

      background:
        var(--gold);

      color:
        #111;

      border-color:
        var(--gold);
    }

    .date-main {

      display:
        block;

      font-size:
        15px;
    }

    .date-small {

      display:
        block;

      margin-top:
        3px;

      font-size:
        11px;

      opacity:
        .8;
    }

    /* =========================
       SUMMARY
    ========================= */

    .summary {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        13px;

      color:
        var(--muted);

      font-size:
        13px;
    }

    .summary strong {

      color:
        white;
    }

    /* =========================
       LIVE BAR
    ========================= */

    .live-bar {

      display:
        none;

      margin-bottom:
        18px;

      padding:
        13px 16px;

      border:
        1px solid
        rgba(22, 214, 138, .3);

      background:
        linear-gradient(
          90deg,
          rgba(7, 63, 49, .9),
          rgba(7, 63, 49, .45)
        );

      border-radius:
        13px;

      color:
        #8fffcf;

      font-weight:
        900;
    }

    .live-bar.show {
      display: block;
    }

    .live-dot {

      display:
        inline-block;

      width: 8px;

      height: 8px;

      margin-inline-end:
        8px;

      border-radius:
        50%;

      background:
        var(--green);

      box-shadow:
        0 0 10px
        var(--green);
    }

    /* =========================
       LEAGUE
    ========================= */

    .league {

      overflow:
        hidden;

      margin-bottom:
        20px;

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      background:
        rgba(16, 31, 54, .86);

      box-shadow:
        0 8px 35px
        rgba(0,0,0,.12);
    }

    .league-header {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap: 15px;

      padding:
        14px 17px;

      background:
        var(--card2);

      border-inline-start:
        4px solid
        var(--gold);
    }

    .league-name {

      display:
        flex;

      align-items:
        center;

      gap: 9px;

      font-size:
        16px;

      font-weight:
        900;
    }

    .league-count {

      color:
        var(--muted);

      font-size:
        12px;
    }

    /* =========================
       MATCH
    ========================= */

    .match {

      border-top:
        1px solid
        var(--border);

      padding:
        17px 15px;
    }

    .match-meta {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      color:
        var(--muted);

      font-size:
        11px;

      margin-bottom:
        15px;
    }

    .important {

      color:
        #ffd36a;

      font-weight:
        900;
    }

    .match-grid {

      display:
        grid;

      grid-template-columns:
        1fr 130px 1fr;

      align-items:
        center;

      gap: 10px;
    }

    .team {

      min-width:
        0;

      text-align:
        center;
    }

    .team-logo {

      display:
        block;

      width:
        58px;

      height:
        58px;

      margin:
        0 auto 8px;

      object-fit:
        contain;
    }

    .team-name {

      font-size:
        15px;

      font-weight:
        900;

      line-height:
        1.45;

      word-break:
        break-word;
    }

    .score-box {

      text-align:
        center;
    }

    .score {

      font-size:
        28px;

      font-weight:
        950;

      letter-spacing:
        .5px;
    }

    .match-time {

      color:
        white;

      font-size:
        13px;

      font-weight:
        800;

      margin-top:
        2px;
    }

    .status {

      display:
        inline-block;

      margin-top:
        7px;

      padding:
        4px 9px;

      border-radius:
        20px;

      background:
        #2d3d55;

      color:
        #d4deea;

      font-size:
        10px;

      font-weight:
        900;
    }

    .status.live {

      background:
        var(--green-bg);

      color:
        #7dffca;

      border:
        1px solid
        rgba(22,214,138,.25);
    }

    .status.finished {

      background:
        #313c4e;

      color:
        #bbc7d5;
    }

    /* =========================
       MATCH DETAILS
    ========================= */

    .match-details {

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      flex-wrap:
        wrap;

      gap:
        8px 18px;

      margin-top:
        14px;

      padding-top:
        11px;

      border-top:
        1px solid
        rgba(38,61,93,.7);

      color:
        var(--muted);

      font-size:
        11px;
    }

    .channel {

      color:
        #ffd35b;

      font-weight:
        900;
    }

    /* =========================
       EMPTY / LOADING / ERROR
    ========================= */

    .message {

      padding:
        55px 20px;

      text-align:
        center;

      border:
        1px dashed
        var(--border);

      border-radius:
        16px;

      background:
        var(--card);

      color:
        var(--muted);
    }

    .message-icon {

      font-size:
        36px;

      margin-bottom:
        10px;
    }

    .retry {

      margin-top:
        13px;

      padding:
        9px 17px;

      border:
        0;

      border-radius:
        9px;

      background:
        var(--gold);

      color:
        #111;

      font-weight:
        900;

      cursor:
        pointer;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {

      width:
        min(1150px, 94%);

      margin:
        0 auto;

      padding:
        20px 0 35px;

      border-top:
        1px solid
        var(--border);

      color:
        #617894;

      font-size:
        11px;

      text-align:
        center;
    }

    /* =========================
       RTL
    ========================= */

    html[dir="rtl"] .hero {

      flex-direction:
        row;

    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .header-inner {

        min-height:
          68px;

      }

      .brand-subtitle {

        display:
          none;

      }

      .brand-title {

        font-size:
          18px;

      }

      .hero {

        align-items:
          flex-start;

        flex-direction:
          column;

      }

      .refresh {

        width:
          100%;
      }

      .match-grid {

        grid-template-columns:
          1fr 80px 1fr;

      }

      .team-logo {

        width:
          46px;

        height:
          46px;
      }

      .team-name {

        font-size:
          13px;
      }

      .score {

        font-size:
          22px;
      }

      .date-nav {

        gap:
          7px;
      }

      .date-button {

        padding:
          11px 5px;
      }

      .date-small {

        font-size:
          10px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="header-inner">

      <a
        href="/"
        class="brand"
      >

        <div class="brand-icon">
          ⚽
        </div>

        <div>

          <div class="brand-title">
            Modarraj Live
          </div>

          <div
            class="brand-subtitle"
            data-i18n="subtitle"
          >
            Live Football Scores
          </div>

        </div>

      </a>


      <div
        class="language-switch"
        aria-label="Language"
      >

        <button
          id="enBtn"
          class="lang active"
          type="button"
        >
          EN
        </button>

        <button
          id="arBtn"
          class="lang"
          type="button"
        >
          AR
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>


    <section class="hero">

      <div>

        <h1 data-i18n="title">
          Live Football Scores
        </h1>

        <p data-i18n="description">
          Follow today's most important matches
        </p>

      </div>


      <button
        id="refreshBtn"
        class="refresh"
        type="button"
      >
        ↻
        <span data-i18n="refresh">
          Refresh
        </span>
      </button>

    </section>


    <!-- =========================
         DATE NAV
    ========================= -->

    <nav
      class="date-nav"
      aria-label="Dates"
    >

      <button
        class="date-button"
        data-offset="-1"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="yesterday"
        >
          Yesterday
        </span>

        <span
          class="date-small"
          id="dateMinus"
        >
        </span>

      </button>


      <button
        class="date-button active"
        data-offset="0"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="today"
        >
          Today
        </span>

        <span
          class="date-small"
          id="dateToday"
        >
        </span>

      </button>


      <button
        class="date-button"
        data-offset="1"
        type="button"
      >

        <span
          class="date-main"
          data-i18n="tomorrow"
        >
          Tomorrow
        </span>

        <span
          class="date-small"
          id="datePlus"
        >
        </span>

      </button>

    </nav>


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="summary">

      <span>

        <span data-i18n="matches">
          Matches
        </span>

        :

        <strong id="matchCount">
          0
        </strong>

      </span>


      <span id="selectedDate">
      </span>

    </div>


    <!-- =========================
         LIVE BAR
    ========================= -->

    <div
      id="liveBar"
      class="live-bar"
    >

      <span class="live-dot"></span>

      <span data-i18n="liveNow">
        Live Now
      </span>

    </div>


    <!-- =========================
         MATCHES
    ========================= -->

    <section id="matches">

      <div class="message">

        <div class="message-icon">
          ⏳
        </div>

        <div data-i18n="loading">
          Loading matches...
        </div>

      </div>

    </section>


  </main>


  <footer>

    <span>
      Modarraj Live © 2026
    </span>

  </footer>


  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const API =
      "/api/matches";


    let language =
      localStorage.getItem(
        "modarraj-language"
      ) || "en";


    let currentDate =
      getDateOffset(0);


    /* =====================================================
       TRANSLATIONS
    ===================================================== */

    const translations = {

      en: {

        subtitle:
          "Live Football Scores",

        title:
          "Live Football Scores",

        description:
          "Follow today's most important matches",

        refresh:
          "Refresh",

        yesterday:
          "Yesterday",

        today:
          "Today",

        tomorrow:
          "Tomorrow",

        matches:
          "Matches",

        liveNow:
          "Live Now",

        loading:
          "Loading matches...",

        noMatches:
          "No matches scheduled for this date.",

        error:
          "Unable to load matches.",

        retry:
          "Try Again",

        important:
          "Important Match",

        notStarted:
          "Not Started",

        live:
          "LIVE",

        halftime:
          "Half Time",

        finished:
          "Finished",

        other:
          "Other",

        venue:
          "Venue",

        location:
          "Location"

      },


      ar: {

        subtitle:
          "نتائج كرة القدم المباشرة",

        title:
          "مباريات كرة القدم",

        description:
          "تابع أهم مباريات اليوم",

        refresh:
          "تحديث",

        yesterday:
          "أمس",

        today:
          "اليوم",

        tomorrow:
          "غداً",

        matches:
          "المباريات",

        liveNow:
          "مباشر الآن",

        loading:
          "جاري تحميل المباريات...",

        noMatches:
          "لا توجد مباريات مجدولة في هذا التاريخ.",

        error:
          "تعذر تحميل المباريات.",

        retry:
          "إعادة المحاولة",

        important:
          "مباراة مهمة",

        notStarted:
          "لم تبدأ بعد",

        live:
          "مباشر",

        halftime:
          "نهاية الشوط الأول",

        finished:
          "انتهت المباراة",

        other:
          "بطولات أخرى",

        venue:
          "الملعب",

        location:
          "الموقع"

      }

    };


    /* =====================================================
       I18N
    ===================================================== */

    function t(key) {

      return (
        translations[
          language
        ]?.[key] ||
        translations.en[key] ||
        key
      );

    }


    function applyLanguage() {

      const html =
        document.documentElement;


      html.lang =
        language;

      html.dir =
        language === "ar"
          ? "rtl"
          : "ltr";


      document
        .querySelectorAll(
          "[data-i18n]"
        )
        .forEach(
          element => {

            const key =
              element.dataset.i18n;

            element.textContent =
              t(key);

          }
        );


      document
        .getElementById(
          "enBtn"
        )
        .classList.toggle(
          "active",
          language === "en"
        );


      document
        .getElementById(
          "arBtn"
        )
        .classList.toggle(
          "active",
          language === "ar"
        );


      updateDateLabels();


      if (
        window.currentMatches
      ) {

        renderMatches(
          window.currentMatches
        );

      }

    }


    /* =====================================================
       DATE
    ===================================================== */

    function dateObject(offset) {

      const date =
        new Date();

      date.setHours(
        12,
        0,
        0,
        0
      );

      date.setDate(
        date.getDate() +
        offset
      );

      return date;

    }


    function formatApiDate(date) {

      return [
        date.getFullYear(),
        String(
          date.getMonth() + 1
        ).padStart(2, "0"),
        String(
          date.getDate()
        ).padStart(2, "0")
      ].join("-");

    }


    function getDateOffset(offset) {

      return formatApiDate(
        dateObject(offset)
      );

    }


    function formatDisplayDate(date) {

      return date.toLocaleDateString(
        language === "ar"
          ? "ar-SA"
          : "en-US",
        {
          month: "short",
          day: "numeric"
        }
      );

    }


    function updateDateLabels() {

      document
        .getElementById(
          "dateMinus"
        )
        .textContent =
        formatDisplayDate(
          dateObject(-1)
        );


      document
        .getElementById(
          "dateToday"
        )
        .textContent =
        formatDisplayDate(
          dateObject(0)
        );


      document
        .getElementById(
          "datePlus"
        )
        .textContent =
        formatDisplayDate(
          dateObject(1)
        );


      document
        .getElementById(
          "selectedDate"
        )
        .textContent =
        formatDisplayDate(
          new Date(
            currentDate +
            "T12:00:00"
          )
        );

    }


    /* =====================================================
       SAFE HTML
    ===================================================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =====================================================
       MATCH STATUS
    ===================================================== */

    function getMatchStatus(match) {

      const status =
        String(
          match?.fixture?.status?.short ||
          ""
        ).toUpperCase();


      if (
        [
          "LIVE",
          "1H",
          "2H",
          "ET",
          "P"
        ].includes(status)
      ) {

        return {
          text: t("live"),
          className: "live"
        };

      }


      if (
        status === "HT"
      ) {

        return {
          text: t("halftime"),
          className: "live"
        };

      }


      if (
        [
          "FT",
          "FINAL",
          "AET",
          "PEN"
        ].includes(status)
      ) {

        return {
          text: t("finished"),
          className: "finished"
        };

      }


      return {
        text: t("notStarted"),
        className: ""
      };

    }


    /* =====================================================
       MATCH TIME
    ===================================================== */

    function getMatchTime(match) {

      const value =
        match?.fixture?.time ||
        match?.fixture?.date ||
        "";

      if (!value) {
        return "--:--";
      }

      const text = String(value).trim();

      /*
       * When the API provides a real timestamp,
       * convert it to the visitor's device timezone.
       */
      if (
        text.includes("T") ||
        text.endsWith("Z") ||
        /[+-]\d{2}:\d{2}$/.test(text)
      ) {

        const parsed = new Date(text);

        if (!Number.isNaN(parsed.getTime())) {

          return new Intl.DateTimeFormat(
            undefined,
            {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false
            }
          ).format(parsed);

        }

      }

      /*
       * Plain API time such as 20:00 or 20:00:00.
       * There is no timezone information in this value,
       * so it is displayed unchanged.
       */
      const timeMatch =
        text.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);

      if (timeMatch) {

        return (
          String(Number(timeMatch[1])).padStart(2, "0") +
          ":" +
          timeMatch[2]
        );

      }

      /*
       * If fixture.date itself is a timestamp, use it.
       */
      const parsedDate = new Date(text);

      if (!Number.isNaN(parsedDate.getTime())) {

        return new Intl.DateTimeFormat(
          undefined,
          {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          }
        ).format(parsedDate);

      }

      return "--:--";

    }


    /* =====================================================
       LEAGUE PRIORITY
    ===================================================== */

   const leaguePriority = {

  // 🌍 World
  "FIFA World Cup": 120,
  "World Cup": 120,

  // 🇪🇺 Europe
  "UEFA Champions League": 118,
  "UEFA Europa League": 114,
  "UEFA Europa Conference League": 110,

  // 🏴 England
  "English Premier League": 108,
  "Premier League": 108,

  // 🇪🇸 Spain
  "La Liga": 106,

  // 🇮🇹 Italy
  "Serie A": 104,

  // 🇩🇪 Germany
  "Bundesliga": 102,

  // 🇫🇷 France
  "Ligue 1": 100,

  // 🇸🇦 Saudi Arabia
  "Saudi Pro League": 96,
  "Saudi Professional League": 96,
  "Saudi-Arabian Pro League": 96,

  // 🌏 Asia
  "AFC Champions League Elite": 94,
  "AFC Champions League": 92,

  // 🇲🇦 Morocco
  "Moroccan Botola": 90,
  "Botola Pro": 90,

  // 🇪🇬 Egypt
  "Egyptian Premier League": 88,

  // 🇶🇦 Qatar
  "Qatar Stars League": 86,

  // 🇦🇪 UAE
  "UAE Pro League": 84,

  // 🇮🇶 Iraq
  "Iraq Stars League": 82,

  // 🇰🇼 Kuwait
  "Kuwait Premier League": 80,

  // 🇹🇳 Tunisia
  "Tunisian Ligue 1": 78,

  // 🇩🇿 Algeria
  "Algeria Ligue 1": 76

};


    function getLeaguePriority(name) {

      const value =
        String(
          name || ""
        );


      return (
        leaguePriority[value] ||
        20
      );

    }


    /* =====================================================
       MATCH PRIORITY
    ===================================================== */

    function getMatchPriority(match) {

      let score =
        getLeaguePriority(
          match?.league?.name
        );


      const status =
        match?.fixture?.status?.short;


      if (
        [
          "LIVE",
          "HT"
        ].includes(status)
      ) {

        score += 5000;

      }


      return score;

    }


    /* =====================================================
       CHANNEL
       IMPORTANT:
       Don't render if unavailable
    ===================================================== */

    function getChannel(match) {

      const channel =
        match?.media?.channel;


      if (
        typeof channel !==
        "string"
      ) {

        return "";

      }


      const value =
        channel.trim();


      if (
        !value ||
        value === "-" ||
        value.toLowerCase() ===
          "null" ||
        value.toLowerCase() ===
          "undefined"
      ) {

        return "";

      }


      return value;

    }


    /* =====================================================
       MATCH CARD
    ===================================================== */

    function renderMatch(match) {

      const home =
        match?.teams?.home ||
        {};

      const away =
        match?.teams?.away ||
        {};


      const status =
        getMatchStatus(
          match
        );


      const homeScore =
        match?.goals?.home;


      const awayScore =
        match?.goals?.away;


      let score =
        "VS";


      if (
        homeScore !== null &&
        homeScore !== undefined &&
        awayScore !== null &&
        awayScore !== undefined
      ) {

        score =
          `${homeScore} - ${awayScore}`;

      }


      const channel =
        getChannel(match);


      const important =
        getLeaguePriority(
          match?.league?.name
        ) >= 70;


      return `

        <article class="match">


          <div class="match-meta">

            <span>
              ${escapeHtml(
                getMatchTime(match)
              )}
            </span>


            ${
              important
                ? `
                  <span class="important">
                    ⭐
                    ${escapeHtml(
                      t("important")
                    )}
                  </span>
                `
                : ""
            }

          </div>


          <div class="match-grid">


            <!-- HOME -->

            <div class="team">

              ${
                home.logo
                  ? `
                    <img
                      class="team-logo"
                      src="${escapeHtml(
                        home.logo
                      )}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }


              <div class="team-name">

                ${escapeHtml(
                  home.name ||
                  "Unknown Team"
                )}

              </div>

            </div>


            <!-- SCORE -->

            <div class="score-box">

              <div class="score">
                ${escapeHtml(
                  score
                )}
              </div>


              <div class="match-time">

                ${escapeHtml(
                  getMatchTime(match)
                )}

              </div>


              <span
                class="status ${status.className}"
              >

                ${escapeHtml(
                  status.text
                )}

              </span>

            </div>


            <!-- AWAY -->

            <div class="team">

              ${
                away.logo
                  ? `
                    <img
                      class="team-logo"
                      src="${escapeHtml(
                        away.logo
                      )}"
                      alt=""
                      loading="lazy"
                    >
                  `
                  : ""
              }


              <div class="team-name">

                ${escapeHtml(
                  away.name ||
                  "Unknown Team"
                )}

              </div>

            </div>


          </div>


          <!-- DETAILS -->

          ${
            (
              match?.venue ||
              match?.city ||
              channel
            )
              ? `

                <div class="match-details">


                  ${
                    match?.venue
                      ? `
                        <span>
                          🏟️
                          ${escapeHtml(
                            match.venue
                          )}
                        </span>
                      `
                      : ""
                  }


                  ${
                    match?.city
                      ? `
                        <span>
                          📍
                          ${escapeHtml(
                            match.city
                          )}
                        </span>
                      `
                      : ""
                  }


                  ${
                    channel
                      ? `
                        <span class="channel">
                          📺
                          ${escapeHtml(
                            channel
                          )}
                        </span>
                      `
                      : ""
                  }


                </div>

              `
              : ""
          }


        </article>

      `;

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderMatches(matches) {

      const container =
        document.getElementById(
          "matches"
        );


      const list =
        Array.isArray(matches)
          ? [...matches]
          : [];


      document.getElementById(
        "matchCount"
      ).textContent =
        list.length;


      const liveCount =
        list.filter(
          match =>
            [
              "LIVE",
              "HT"
            ].includes(
              match?.fixture?.status?.short
            )
        ).length;


      const liveBar =
        document.getElementById(
          "liveBar"
        );


      liveBar.classList.toggle(
        "show",
        liveCount > 0
      );


      if (!list.length) {

        container.innerHTML = `

          <div class="message">

            <div class="message-icon">
              ⚽
            </div>

            <div>
              ${escapeHtml(
                t("noMatches")
              )}
            </div>

          </div>

        `;

        return;

      }


      list.sort(
        (a, b) =>
          getMatchPriority(b) -
          getMatchPriority(a)
      );


      const groups =
        new Map();


      for (
        const match of list
      ) {

        const league =
          match?.league?.name ||
          t("other");


        if (
          !groups.has(league)
        ) {

          groups.set(
            league,
            []
          );

        }


        groups
          .get(league)
          .push(match);

      }


      container.innerHTML =
        [...groups.entries()]
          .map(
            ([league, matches]) => `

              <section class="league">


                <div
                  class="league-header"
                >

                  <div
                    class="league-name"
                  >

                    <span>
                      🏆
                    </span>

                    <span>
                      ${escapeHtml(
                        league
                      )}
                    </span>

                  </div>


                  <div
                    class="league-count"
                  >

                    ${matches.length}

                  </div>

                </div>


                ${matches
                  .map(
                    renderMatch
                  )
                  .join("")}


              </section>

            `
          )
          .join("");

    }


    /* =====================================================
       LOAD
    ===================================================== */

    async function loadMatches() {

      const container =
        document.getElementById(
          "matches"
        );


      container.innerHTML = `

        <div class="message">

          <div class="message-icon">
            ⏳
          </div>

          <div>
            ${escapeHtml(
              t("loading")
            )}
          </div>

        </div>

      `;


      try {

        const response =
          await fetch(
            `${API}?date=${encodeURIComponent(
              currentDate
            )}`,
            {
              method:
                "GET",

              cache:
                "no-store",

              headers: {
                Accept:
                  "application/json"
              }
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const json =
          await response.json();


        console.log(
          "Modarraj Live:",
          json
        );


        const matches =
          Array.isArray(
            json.data
          )
            ? json.data
            : [];


        window.currentMatches =
          matches;


        renderMatches(
          matches
        );


      } catch (error) {

        console.error(
          "Modarraj Live error:",
          error
        );


        document.getElementById(
          "matchCount"
        ).textContent =
          "0";


        document.getElementById(
          "liveBar"
        ).classList.remove(
          "show"
        );


        container.innerHTML = `

          <div class="message">

            <div class="message-icon">
              ⚠️
            </div>

            <div>
              ${escapeHtml(
                t("error")
              )}
            </div>

            <button
              class="retry"
              type="button"
              onclick="loadMatches()"
            >
              ${escapeHtml(
                t("retry")
              )}
            </button>

          </div>

        `;

      }

    }


    /* =====================================================
       LANGUAGE BUTTONS
    ===================================================== */

    document
      .getElementById(
        "enBtn"
      )
      .addEventListener(
        "click",
        () => {

          language =
            "en";

          localStorage.setItem(
            "modarraj-language",
            language
          );

          applyLanguage();

        }
      );


    document
      .getElementById(
        "arBtn"
      )
      .addEventListener(
        "click",
        () => {

          language =
            "ar";

          localStorage.setItem(
            "modarraj-language",
            language
          );

          applyLanguage();

        }
      );


    /* =====================================================
       REFRESH
    ===================================================== */

    document
      .getElementById(
        "refreshBtn"
      )
      .addEventListener(
        "click",
        loadMatches
      );


    /* =====================================================
       DATE BUTTONS
    ===================================================== */

    document
      .querySelectorAll(
        ".date-button"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".date-button"
                )
                .forEach(
                  item =>
                    item.classList
                      .remove(
                        "active"
                      )
                );


              button.classList.add(
                "active"
              );


              const offset =
                Number(
                  button.dataset.offset
                );


              currentDate =
                getDateOffset(
                  offset
                );


              updateDateLabels();


              loadMatches();

            }
          );

        }
      );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    applyLanguage();

    updateDateLabels();

    loadMatches();


    /* =====================================================
       AUTO REFRESH
    ===================================================== */

    setInterval(
      () => {

        /*
          تحديث تلقائي كل دقيقة.
          مفيد للمباريات المباشرة.
        */

        loadMatches();

      },
      60 * 1000
    );


  </script>
