            --card-hover: #162941;

            --gold: #f59e0b;

            --red-soft: rgba(239, 68, 68, .13);

        }

        html {

        }

            color: var(--text);

        header {
            background:

                    #102a56,
                    #07111f 70%

            padding: 28px 20px 24px;

            text-align: center;

            border-bottom:

            box-shadow:

        .brand {

        .subtitle {

            color: var(--muted);

            font-size: 14px;
        }

        .connection-status {
            display: inline-flex;

            gap: 7px;

            margin-top: 13px;

            padding: 5px 11px;

            background: rgba(16, 185, 129, .1);

            color: #6ee7b7;

            font-size: 11px;
            font-weight: 800;

        .connection-dot {

            margin-bottom: 22px;

        .date-btn {
            border: 1px solid var(--border);

            background: var(--card);

            color: var(--muted);

            padding: 11px 12px;

            border-radius: 12px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 800;

            transition:
                .2s ease;
        }

        .date-btn:hover {
            background: var(--card-hover);

            color: var(--text);

            border-color:
                rgba(245, 158, 11, .45);
        }

        .date-btn.active {
            background:
                linear-gradient(
                    135deg,
                    #f59e0b,
                    #d97706

            color: #111827;

            border-color:
                var(--gold);

            box-shadow:
                0 5px 18px

            font-size: 15px;

<script>

"use strict";

/* =========================================================
   SERVER
========================================================= */

const SERVER_URL =
    window.location.origin;


/* =========================================================
   SOCKET
========================================================= */

let socket = null;

try {

    socket = io(
        SERVER_URL,
        {
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: Infinity
        }
    );

    socket.on(
        "connect",
        () => {

            setConnectionStatus(
                true
            );

            console.log(
                "✅ Socket connected"
            );
        }
    );

    socket.on(
        "disconnect",
        () => {

            setConnectionStatus(
                false
            );

            console.log(
                "⚠️ Socket disconnected"
            );
        }
    );

    socket.on(
        "matchUpdate",
        payload => {

            if (
                payload &&
                payload.date ===
                currentSelectedDate &&
                Array.isArray(payload.matches)
            ) {

                renderMatches(
                    payload.matches
                );
            }
        }
    );

}
catch (error) {

    console.error(
        "Socket error:",
        error
    );

}


/* =========================================================
   ELEMENTS
========================================================= */

const matchesList =
    document.getElementById(
        "matches-list"
    );

const resultsCount =
    document.getElementById(

const updateLabel =
    document.getElementById(

    );

const connectionStatus =

    );


/* =========================================================
   STATE
========================================================= */

let currentSelectedDate = "";

let timerIntervals = [];

let refreshTimer = null;


/* =========================================================
   YEAR
========================================================= */

document.getElementById(
    "current-year"
).textContent =
    new Date().getFullYear();


/* =========================================================
   DATES
========================================================= */

function getDate(offset) {

    const date =
        new Date();

    date.setDate(
        date.getDate() +
        offset
    );

    return [
        date.getFullYear(),
        String(
            date.getMonth() + 1
        ).padStart(2, "0"),
        String(
            date.getDate()
        ).padStart(2, "0")
    ].join("-");
}


const dates = {

    yesterday:
        getDate(-1),

    today:
        getDate(0),

    tomorrow:
        getDate(1)

};

/* =========================================================
   TRANSLATE TEAM
========================================================= */

function translateSportName(
    value,
    fallback = ""
) {

    const original =
        String(
            value ?? ""
        ).trim();

    if (!original) {
        return fallback;
    }

    if (
        AR_TRANSLATIONS[
            original
        ]
    ) {
        return AR_TRANSLATIONS[
            original
        ];
    }

    let translated =
        original
            .replace(
                /\s+\(.*?\)$/g,
                ""
            )
            .replace(
                /\s+Women'?s?$/i,
                " سيدات"
            )
            .replace(
                /\s+W$/i,
                " سيدات"
            );

    for (
        const [from, to]
        of AR_WORDS
    ) {

        const escaped =
            from.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            );

        translated =
            translated.replace(
                new RegExp(
                    `\\b${escaped}\\b`,
                    "gi"
                ),
                to
            );
    }

    return translated;
}

/* =========================================================
   NORMALIZE
========================================================= */

function normalizedText(
    value
) {

    return String(
        value ?? ""
    )
        .toLowerCase()
        .replace(
            /[–—]/g,
            "-"
        )
        .trim();
}


/* =========================================================
   LEAGUE SCORE
========================================================= */

function getLeagueTier(
    leagueName
) {

    const text =
        normalizedText(
            leagueName
        );

    for (
        const tier
        of LEAGUE_TIERS
    ) {

        if (
            tier.words.some(
                word =>
                    text.includes(
                        word
                    )
            )
        ) {

            return tier.score;
        }
    }

    if (
        /(cup|super cup|final|playoff|play-off)/i
            .test(
                leagueName || ""
            )
    ) {
        return 700;
    }

    if (
        /(league|division|premier|pro)/i
            .test(
                leagueName || ""
            )
    ) {
        return 600;
    }

    return 400;
}


/* =========================================================
   TEAM SCORE
========================================================= */

function getTeamBoost(
    teamName
) {

    const text =
        normalizedText(
            teamName
        );

    return BIG_TEAMS.some(
        team =>
            text === team ||
            text.includes(team)
    )
        ? 130
        : 0;
}


/* =========================================================
   IMPORTANCE
========================================================= */

function getImportance(
    match,
    isLive,
    isFinished
) {

    const fixture =
        match.fixture || {};

    const league =
        String(
            match.league?.name || ""
        );

    const home =
        String(
            match.teams?.home?.name || ""
        );

    const away =
        String(
            match.teams?.away?.name || ""
        );

    const apiPriority =
        Number(
            match.priority || 0
        );

    let score =
        Math.max(
            0,
            apiPriority
        );

    score = Math.max(
        score,
        getLeagueTier(
            league
        )
    );

    score +=
        getTeamBoost(home);

    score +=
        getTeamBoost(away);

    if (
        getTeamBoost(home) &&
        getTeamBoost(away)
    ) {

        score += 180;
    }

    if (isLive) {
        score += 10000;
    }

    if (isFinished) {
        score -= 500;
    }

    const statusLong =
        String(
            fixture.status?.long ||
            ""
        );

    if (
        /(final|semi|semifinal|playoff|play-off)/i
            .test(
                statusLong
            )
    ) {

        score += 150;
    }

    return score;
}


/* =========================================================
   STATUS
========================================================= */

function getStatusInfo(
    match
) {

    const short =
        String(
            match.fixture?.status?.short ||
            "NS"
        ).toUpperCase();

    const liveStatuses = [
        "LIVE",
        "1H",
        "2H",
        "ET",
        "BT",
        "P",
        "INT",
        "HT"
    ];

    const finishedStatuses = [
        "FT",
        "AET",
        "PEN"
    ];

    return {

        short,

        isLive:
            liveStatuses.includes(
                short
            ),

        isFinished:
            finishedStatuses.includes(
                short
            )

    };
}

}

/* =========================================================
   FETCH MATCHES
========================================================= */

async function fetchMatches(
    dateString
) {

    currentSelectedDate =
        dateString;

    clearTimers();

    showLoading();

    updateLabel.textContent =
        "جاري التحديث...";

    try {

        const response =
            await fetch(
                `${SERVER_URL}/api/matches?date=${encodeURIComponent(dateString)}`,
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        if (
            !data ||
            !Array.isArray(
                data.data
            )
        ) {

            throw new Error(
                "صيغة البيانات غير صحيحة"
            );
        }

        renderMatches(
            data.data
        );

        updateLabel.textContent =
            data.cached
                ? "من الذاكرة"
                : "تم التحديث الآن";

    }
    catch (error) {

        console.error(
            "❌ Fetch matches:",
            error
        );

        matchesList.innerHTML =

            `
            <div
                class="
                    no-matches
                    error-box
                "
            >
                تعذر تحميل المباريات حاليًا.
                <br>
                حاول تحديث الصفحة بعد قليل.
            </div>
            `;

        updateLabel.textContent =
            "تعذر التحديث";
    }
}


/* =========================================================
   CLEAR TIMERS
========================================================= */

function clearTimers() {

    timerIntervals.forEach(
        timer =>
            clearInterval(timer)
    );

    timerIntervals = [];
}


/* =========================================================
   RENDER
========================================================= */

function renderMatches(
    matches
) {

    clearTimers();

    if (
        !Array.isArray(matches) ||
        matches.length === 0
    ) {

        resultsCount.textContent =
            "0";

        matchesList.innerHTML =

            `
            <div class="no-matches">

                🏁 لا توجد مباريات
                مجدولة في هذا التاريخ.

            </div>
            `;

        return;
    }


    /* =====================================================
       NORMALIZE
    ===================================================== */

    const normalized =
        matches.map(
            (match, index) => {

                const status =
                    getStatusInfo(
                        match
                    );

                const importance =
                    getImportance(
                        match,
                        status.isLive,
                        status.isFinished
                    );

                return {

                    match,

                    index,

                    statusShort:
                        status.short,

                    isLive:
                        status.isLive,

                    isFinished:
                        status.isFinished,

                    importance,

                    leagueOriginal:
                        String(
                            match.league?.name ||
                            "بطولات أخرى"
                        ),

                    leagueName:
                        translateLeagueName(
                            match.league?.name
                        ),

                    matchTime:
                        new Date(
                            match.fixture?.date ||
                            0
                        ).getTime()

                };

            }
        );


    /* =====================================================
       SORT
    ===================================================== */

    normalized.sort(
        (a, b) => {

            if (
                a.isLive !==
                b.isLive
            ) {

                return a.isLive
                    ? -1
                    : 1;
            }

            if (
                b.importance !==
                a.importance
            ) {

                return (
                    b.importance -
                    a.importance
                );
            }

            return (
                a.matchTime -
                b.matchTime
            );

        }
    );


    resultsCount.textContent =
        normalized.length;


    matchesList.innerHTML = "";


    /* =====================================================
       LIVE
    ===================================================== */

    const liveMatches =
        normalized.filter(
            item =>
                item.isLive
        );


    /* =====================================================
       IMPORTANT
    ===================================================== */

    const importantMatches =
        normalized.filter(
            item =>
                !item.isLive &&
                !item.isFinished &&
                item.importance >= 1100
        );


    const importantIds =
        new Set(
            importantMatches.map(
                item =>
                    `${item.match.fixture?.id || ""}-${item.index}`
            )
        );


    /* =====================================================
       REMAINING
    ===================================================== */

    const remaining =
        normalized.filter(
            item =>
                !item.isLive &&
                !importantIds.has(
                    `${item.match.fixture?.id || ""}-${item.index}`
                )
        );


    /* =====================================================
       APPEND LIVE
    ===================================================== */

    appendSection(
        "🔴 المباريات المباشرة الآن",
        liveMatches,
        "live"
    );


    /* =====================================================
       APPEND IMPORTANT
    ===================================================== */

    appendSection(
        "⭐ أهم مباريات اليوم",
        importantMatches,
        "important"
    );


    /* =====================================================
       GROUP BY LEAGUE
    ===================================================== */

    const grouped = {};


    remaining.forEach(
        item => {

            const name =
                item.leagueName ||
                "بطولات أخرى";

            if (
                !grouped[name]
            ) {

                grouped[name] = [];
            }

            grouped[name].push(
                item
            );

        }
    );


    /* =====================================================
       SORT LEAGUES
    ===================================================== */

    Object.entries(
        grouped
    )
        .sort(
            (
                [, matchesA],
                [, matchesB]
            ) => {

                const scoreA =
                    Math.max(
                        ...matchesA.map(
                            x =>
                                x.importance
                        )
                    );

                const scoreB =
                    Math.max(
                        ...matchesB.map(
                            x =>
                                x.importance
                        )
                    );

                if (
                    scoreB !== scoreA
                ) {

                    return (
                        scoreB -
                        scoreA
                    );
                }

                return (
                    matchesA[0]
                        .matchTime -
                    matchesB[0]
                        .matchTime
                );

            }
        )
        .forEach(
            (
                [
                    leagueName,
                    leagueMatches
                ]
            ) => {

                leagueMatches.sort(
                    (a, b) => {

                        if (
                            b.importance !==
                            a.importance
                        ) {

                            return (
                                b.importance -
                                a.importance
                            );
                        }

                        return (
                            a.matchTime -
                            b.matchTime
                        );

                    }
                );


                appendSection(
                    `🏆 ${escapeHtml(leagueName)}`,
                    leagueMatches,
                    ""
                );

            }
        );

}

    const header =
        document.createElement(

    header.className =
        `section-title ${className}`;


    header.innerHTML =

        `
        <span>

        </span>

        <span

        >
            ${items.length}
        </span>

    matchesList.appendChild(

        (item, index) => {

            createMatchCard(
                item,
                `${item.match.fixture?.id || "match"}-${item.index}-${index}`
            );

        }
    );

}

            </div>

        </div>

        ${mediaHtml}
        `;


    matchesList.appendChild(
        card
    );


    const infoBox =
        document.getElementById(
            infoId
        );


    /* =====================================================
       LIVE
    ===================================================== */

    if (isLive) {

        const homeGoals =
            goals.home ??
            0;

        const awayGoals =
            goals.away ??
            0;

        const elapsed =
            match.fixture?.status?.elapsed;


        infoBox.innerHTML =

            `
            ${badge}

            <div
                class="
                    score
                    live-score
                "
            >
                ${homeGoals}
                -
                ${awayGoals}
            </div>

            <span
                class="status-badge"
            >
                مباشر
                ${
                    elapsed
                        ? ` ${escapeHtml(elapsed)}'`
                        : ""
                }
            </span>
            `;


        return;
    }


    /* =====================================================
       FINISHED
    ===================================================== */

    if (isFinished) {

        infoBox.innerHTML =

            `
            ${badge}

            <div class="score">
                ${goals.home ?? 0}
                -
                ${goals.away ?? 0}
            </div>

            <span
                class="
                    status-badge
                    status-finished
                "
            >
                انتهت
            </span>
            `;


        return;
    }


    /* =====================================================
       NOT STARTED
    ===================================================== */

    if (
        status === "NS" ||
        !status
    ) {

        const date =
            new Date(
                match.fixture?.date ||
                0
            );

        const timestamp =
            date.getTime();


        const renderCountdown =
            () => {

                const diff =
                    timestamp -
                    Date.now();


                if (
                    !Number.isFinite(
                        timestamp
                    ) ||
                    diff <= 0
                ) {

                    infoBox.innerHTML =

                        `
                        ${badge}

                        <div
                            class="score"
                        >
                            VS
                        </div>

                        <span
                            class="
                                status-badge
                                status-upcoming
                            "
                        >
                            تبدأ الآن
                        </span>
                        `;

                    return false;
                }


                const hours =
                    Math.floor(
                        diff /
                        3600000
                    );

                const minutes =
                    Math.floor(
                        (
                            diff %
                            3600000
                        ) /
                        60000
                    );

                const seconds =
                    Math.floor(
                        (
                            diff %
                            60000
                        ) /
                        1000
                    );


                const h =
                    String(
                        hours
                    ).padStart(
                        2,
                        "0"
                    );

                const m =
                    String(
                        minutes
                    ).padStart(
                        2,
                        "0"
                    );

                const s =
                    String(
                        seconds
                    ).padStart(
                        2,
                        "0"
                    );


                const time =
                    date.toLocaleTimeString(
                        "ar-SA",
                        {
                            hour:
                                "2-digit",
                            minute:
                                "2-digit"
                        }
                    );


                infoBox.innerHTML =

                    `
                    ${badge}

                    <div
                        class="score"
                    >
                        VS
                    </div>

                    <div
                        class="countdown"
                    >
                        تبدأ بعد
                        ${h}:${m}:${s}
                    </div>

                    <div
                        class="match-time"
                    >
                        ${escapeHtml(time)}
                    </div>
                    `;


                return true;
            };


        if (
            renderCountdown()
        ) {

            const timer =
                setInterval(
                    () => {

                        if (
                            !renderCountdown()
                        ) {

                            clearInterval(
                                timer
                            );
                        }

                    },
                    1000
                );


            timerIntervals.push(
                timer
            );
        }


        return;
    }


    /* =====================================================
       OTHER
    ===================================================== */

    infoBox.innerHTML =

        `
        ${badge}

        <div class="score">
            ${
                goals.home ??
                "-"
            }
            -
            ${
                goals.away ??
                "-"
            }
        </div>

        <span
            class="
                status-badge
                status-upcoming
            "
        >
            قريبًا
        </span>
        `;

}


/* =========================================================
   DATE BUTTONS
========================================================= */

function setActiveButton(
    id
) {

    document
        .querySelectorAll(
            ".date-btn"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );


    document
        .getElementById(id)
        .classList.add(
            "active"
        );
}


document
    .getElementById(
        "btn-yesterday"
    )
    .addEventListener(
        "click",
        () => {

            setActiveButton(
                "btn-yesterday"
            );

            fetchMatches(
                dates.yesterday
            );

        }
    );


document
    .getElementById(
        "btn-today"
    )
    .addEventListener(
        "click",
        () => {

            setActiveButton(
                "btn-today"
            );

            fetchMatches(
                dates.today
            );

        }
    );


document
    .getElementById(
        "btn-tomorrow"
    )
    .addEventListener(
        "click",
        () => {

            setActiveButton(
                "btn-tomorrow"
            );

            fetchMatches(
                dates.tomorrow
            );

        }
    );


/* =========================================================
   AUTO REFRESH
========================================================= */

function startAutoRefresh() {

    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );
    }


    refreshTimer =
        setInterval(
            () => {

                fetchMatches(
                    currentSelectedDate ||
                    dates.today
                );

            },
            30000
        );
}


startAutoRefresh();


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        fetchMatches(
            dates.today
        );

    }
);

</script>
